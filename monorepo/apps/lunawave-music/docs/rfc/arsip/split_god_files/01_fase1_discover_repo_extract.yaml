    title: "Extract _fetch_songs() nested function -> method privat _search_songs_only()"
    files:
      - path: "persistence/discover_repo.py"
        action: edit
        cari_persis: |
          async def _fetch_songs():
                  async with self._conn.execute(sql_songs, song_params_full) as cursor:
                      return [dict(r) for r in await cursor.fetchall()]
        ganti_dengan: |
          async def _search_songs_only(self, sql_songs: str, params: list) -> list[dict]:
              """Isi lama nested function `_fetch_songs()` -- lihat
              `_search_tracks_only` untuk rationale yang sama."""
              async with self._conn.execute(sql_songs, params) as cursor:
                  return [dict(r) for r in await cursor.fetchall()]

  - id: K.3
    title: "Extract _sort_key nested function -> staticmethod _search_sort_key(), dan sambungkan 3 method baru di search_tracks()"
    files:
      - path: "persistence/discover_repo.py"
        action: edit
        cari_persis: |
                    track_rows, song_rows = await asyncio.gather(_fetch_tracks(), _fetch_songs())
        ganti_dengan: |
                    track_rows, song_rows = await asyncio.gather(
                        self._search_tracks_only(sql_tracks, track_params_full),
                        self._search_songs_only(sql_songs, song_params_full),
                    )
      - path: "persistence/discover_repo.py"
        action: edit
        cari_persis: |
          def _sort_key(row: dict):
                  title_l = (row["title"] or "").lower()
                  artist_l = (row["artist"] or "").lower()
                  is_phrase_match = full_phrase in title_l or full_phrase in artist_l
                  return (0 if is_phrase_match else 1, row["rank"])

              rows = sorted(merged.values(), key=_sort_key)
        ganti_dengan: |
          rows = sorted(merged.values(), key=lambda row: self._search_sort_key(row, full_phrase))
        catatan_penting: >
          `_sort_key` lama pakai closure atas `full_phrase` (variabel lokal
          search_tracks). Karena diusulkan jadi @staticmethod (proposal
          §4.K, supaya tidak butuh `self` state), `full_phrase` HARUS
          dilewatkan sebagai parameter eksplisit -- makanya dipanggil
          lewat lambda di `sorted(..., key=lambda row: ...)`, bukan
          `key=self._search_sort_key` langsung (staticmethod 2-parameter
          tidak cocok signature `key=` yang cuma terima 1 arg per elemen).
      - path: "persistence/discover_repo.py"
        action: edit
        deskripsi: "Tambahkan staticmethod _search_sort_key setelah search_tracks(), sebelum get_artist_detail()"
        cari_persis: |
          async def get_artist_detail(self, nama: str) -> dict | None:
        ganti_dengan: |
