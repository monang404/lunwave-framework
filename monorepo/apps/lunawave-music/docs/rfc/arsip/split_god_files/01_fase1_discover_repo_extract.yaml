tasks:
  - id: K.1
    title: "Extract _fetch_tracks() nested function -> method privat _search_tracks_only()"
    files:
      - path: "persistence/discover_repo.py"
        action: edit
        deskripsi: >
          Pindahkan isi nested async function `_fetch_tracks()` (baris
          322-324 di dalam search_tracks) jadi method privat baru
          `_search_tracks_only()` pada class DiscoverRepository. Method
          baru menerima parameter yang saat ini di-closure
          (sql_tracks, track_params_full) sebagai argumen eksplisit,
          BUKAN lewat closure lagi -- supaya method ini bisa di-unit-test
          berdiri sendiri (mock query lebih sempit, sesuai manfaat yang
          disebut proposal §4.K).
        cari_persis: |
          async def _fetch_tracks():
                  async with self._conn.execute(sql_tracks, track_params_full) as cursor:
                      return [dict(r) for r in await cursor.fetchall()]
        ganti_dengan: |
          async def _search_tracks_only(self, sql_tracks: str, params: list) -> list[dict]:
              """Isi lama nested function `_fetch_tracks()` di
              `search_tracks()` -- diekstrak jadi method privat biasa
              (Temuan K, proposal_god_file_splitting.md §4.K) supaya
              bisa di-unit-test terpisah dari `_search_songs_only`.
              """
              async with self._conn.execute(sql_tracks, params) as cursor:
                  return [dict(r) for r in await cursor.fetchall()]
        catatan: >
          Baris pemanggilan di dalam search_tracks() (`track_rows, song_rows
          = await asyncio.gather(_fetch_tracks(), _fetch_songs())`) diubah
          di task K.3 setelah kedua method privat baru ada -- jangan ubah
          baris pemanggilan di task ini dulu supaya tiap task tetap
          independen dan bisa diverifikasi satu-satu.

