konteks_terverifikasi:
  file: "engine/playback/controller.py"
  baris_total: 468
  method_sasaran: "PlaybackController.play_track() -- diverifikasi baris 214-286 (bukan 215-300 persis seperti disebut proposal -- selisih wajar karena proposal menghitung termasuk beberapa baris whitespace/blank di sekitarnya, bukan salah)"
  pola_delegasi_existing: >
    Class SUDAH delegasi ke 6 ops-class lewat __init__ (baris 67-107):
    `self.track_loader` (TrackLoader, baris 86-88), `self._queue_ops`
    (QueueOps), `self._mode_ops` (ModeOps), `self._track_ended_ops`
    (TrackEndedOps), `self._failure_ops` (FailureOps),
    `self._queue_controller` (QueueController),
    `self._settings_controller` (SettingsController). Pola ini SUDAH
    BENAR (proposal §4.L mengonfirmasi ini) -- yang belum ikut pola yang
    sama HANYA `play_track()` itu sendiri.
  isi_play_track_terverifikasi_baris_per_baris: >
    1. Lock acquire (`async with self._play_lock`) -- A-05, cegah
       concurrent play_track race.
    2. State bookkeeping: history.append current_track (kalau ada),
       set current_track/status=LOADING/position/duration/lyrics_lines=[]/
       lyrics_index=0/_crossfade_out_triggered=False, cancel
       _fade_out_task kalau masih jalan.
    3. try: `loaded = await self.track_loader.load_track(track)` --
       INI SUDAH delegasi ke TrackLoader (task load+resolve SUDAH
       selesai, proposal §4.L benar soal ini).
    4. `await self.mpv.play(loaded.uri)`, `asyncio.sleep(0.15)`.
    5. Loudness normalization: import build_af_filter, set
       `state.current_track_gain_db`, panggil `mpv.set_af(...)` dengan
       gain dari `loaded.gain_db` atau 0.0 tergantung
       `state.loudness_normalization_enabled`.
    6. Audio output branch: BROWSER -> `mpv.set_volume(0)` + publish log
       event; SELAIN itu -> kalau `crossfade_enabled` jalankan task
       `apply_crossfade_in` (cancel _fade_task lama dulu kalau ada),
       kalau tidak -> `mpv.set_volume(state.volume)`.
    7. `start_paused` ? `mpv.pause()` : `mpv.resume()`.
    8. `start_position > 0` -> `mpv.seek(start_position)`.
    9. Finalize sukses: `state.status` = PAUSED/PLAYING, `_retry_count=0`,
       `_loading=False`, publish `TrackStartedEvent(track=track)`.
    10. Kalau `state.duration == 0` -> jadwalkan `_poll_duration(track)`
        via `safe_create_task`.
    11. except VideoUnavailableError/BotCheckError,RateLimitedError/
        Exception generic -> SEMUANYA SUDAH delegasi ke
        `self._failure_ops.handle_*()` (proposal §4.L benar, ini bagian
        yang SUDAH ikut pola delegasi).
  kesimpulan: >
    Bagian yang BELUM ikut pola delegasi (poin 4-10 di atas, ~55 baris)
    adalah orkestrasi playback-start: mpv.play + loudness + output
    routing (browser-mute vs crossfade vs volume biasa) + pause/resume/
    seek + finalize state+event + trigger poll_duration. Ini SEMUA
    logika yang SPESIFIK untuk "apa yang terjadi begitu track berhasil
    di-load", bukan load/resolve itu sendiri -- proposal §4.L benar
    bahwa TrackLoader tidak relevan untuk bagian ini (TrackLoader cuma
    urus load+resolve, sudah dipanggil di poin 3).

