desain_extract_diusulkan:
  prinsip: >
    KEPUTUSAN DESAIN LEBIH KONSERVATIF dari yang mungkin tersirat di
    proposal §4.L ("delegasi ke TrackLoader untuk load+resolve, sisakan
    orkestrasi tingkat tinggi") -- karena TrackLoader SUDAH cuma urus
    load+resolve (dikonfirmasi di atas), memindahkan LEBIH BANYAK logic
    ke TrackLoader akan mengubah tanggung jawab TrackLoader itu sendiri
    (dari "load+resolve" jadi "load+resolve+playback-routing"), BUKAN
    solusi yang proposal maksud dan BERISIKO membingungkan batas
    tanggung jawab class yang sudah jelas. Desain di sini SEBALIKNYA:
    extract 3 PRIVATE METHOD BARU di PlaybackController ITU SENDIRI
    (bukan pindah ke class/file lain), supaya play_track() jadi
    orkestrasi tipis yang MEMANGGIL urutan private method, TANPA
    mengubah wiring __init__/menambah ops-class baru (transformasi
    paling minimal-risiko yang tetap menyelesaikan masalah god-method).
    INI DESAIN USULAN, BUKAN RENCANA FINAL -- AI_CONTEXT.md eksplisit:
    "verifikasi dulu isi play_track() baris per baris SAAT EKSEKUSI,
    JANGAN asumsi struktur dari RFC ini saja". Task L.1-L.3 di bawah
    WAJIB diverifikasi ulang terhadap kode aktual (yang mungkin sudah
    berubah sejak RFC ini ditulis) sebelum diterapkan persis seperti ini.
  method_baru_1: "_apply_loudness_and_routing(self, loaded) -- poin 5 & 6 di atas: set current_track_gain_db, mpv.set_af, dan branch output BROWSER/crossfade/volume biasa. Return value: tidak perlu (side-effect only lewat self.mpv/self.state)."
  method_baru_2: "_apply_start_playback_state(self, start_paused, start_position) -- poin 7 & 8: mpv.pause()/resume(), lalu mpv.seek() kalau start_position>0."
  method_baru_3: "_finalize_play_track_success(self, track) -- poin 9 & 10: set status PAUSED/PLAYING (BUTUH tahu start_paused -- lewatkan sebagai parameter tambahan, JANGAN duplikasi baca start_paused dari luar scope), retry_count=0, _loading=False, publish TrackStartedEvent, trigger poll_duration kalau duration==0."
  play_track_setelah_refactor: >
    ```python
    async def play_track(self, track, start_position=0.0, start_paused=False):
        async with self._play_lock:
            # ...state bookkeeping poin 1-2, TIDAK BERUBAH...
            try:
                loaded = await self.track_loader.load_track(track)
                self._loading = True
                self._last_play_start_ts = asyncio.get_event_loop().time()
                await self.mpv.play(loaded.uri)
                await asyncio.sleep(0.15)

                await self._apply_loudness_and_routing(loaded)
                await self._apply_start_playback_state(start_paused, start_position)
                await self._finalize_play_track_success(track, start_paused)

            except VideoUnavailableError as e:
                await self._failure_ops.handle_video_unavailable(track, e)
            except (BotCheckError, RateLimitedError) as e:
                await self._failure_ops.handle_bot_check_or_rate_limited(track, e)
            except Exception as e:
                await self._failure_ops.handle_generic_error(track, e)
    ```
    CATATAN: `uri = loaded.uri` (variabel lokal lama) dihapus, dipakai
    langsung `loaded.uri` -- perubahan kosmetik kecil, TIDAK mengubah
    behavior, TAPI tetap WAJIB diverifikasi tidak ada baris lain yang
    membaca variabel lokal `uri` di scope yang sama (grep dulu sebelum
    hapus).

