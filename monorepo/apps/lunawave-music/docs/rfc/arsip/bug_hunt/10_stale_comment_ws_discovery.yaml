tasks:
  - task_id: P4-T2
    title: "Hapus komentar stale 'unreachable' di ws_discovery.py"
    temuan_ref: 10
    severity_audit: "Dokumentasi (bukan bug eksekusi)"
    depends_on: []
    touches_locked_files: false
    files:
      modify:
        - server/handlers/ws_discovery.py
    steps:
      - >
        `view` server/handlers/ws_discovery.py baris ~139-149 (blok
