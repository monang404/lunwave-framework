        sampai ditambahkan ke DISCOVERY_CMDS di websocket.py -- padahal
        sudah terdaftar di sana, komentar jadi menyesatkan pembaca
        kode (termasuk AI agent yang membaca konteks sebelum
        mengerjakan task lain di file ini).
      root_cause: >
        websocket.py (locked file) diupdate untuk menambahkan
        get_artist_detail ke DISCOVERY_CMDS di patch lain, tapi
        komentar di ws_discovery.py yang merujuk ke kondisi
        "sebelum" itu tidak ikut dibersihkan.
      solution: >
        Hapus/perbarui komentar NOTE agar mencerminkan kondisi kode
        saat ini (branch sudah reachable).
      files: "server/handlers/ws_discovery.py"
      notes: "Perubahan murni komentar, tidak ada perubahan logic. Tidak menyentuh websocket.py (locked)."

post_phase_commands:
