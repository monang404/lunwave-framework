        komentar NOTE (PATCH-2026-07-17-070) yang menyatakan branch ini
        "UNREACHABLE" karena belum masuk DISCOVERY_CMDS.
      - >
        `view` server/handlers/websocket.py baris ~87 untuk konfirmasi
        `DISCOVERY_CMDS = {"search", "discover", "get_artist_detail",
        "discover_search"}` SUDAH menyertakan "get_artist_detail"
        (jadi branch ini SUDAH reachable, komentar sudah basi).
      - >
        Hapus blok komentar NOTE (PATCH-2026-07-17-070) yang salah
        sepenuhnya (6 baris, dari "# NOTE (PATCH-2026-07-17-070):..."
        sampai "...See docs/PATCHLOG.md PATCH-2026-07-17-070..."),
        GANTI dengan komentar singkat 1 baris yang akurat kalau
        konteks tambahan masih berguna, mis.:
        `# get_artist_detail terdaftar di DISCOVERY_CMDS
        (server/handlers/websocket.py) -- branch ini reachable.`
        Atau HAPUS SAJA tanpa pengganti kalau kode di bawahnya (nama
        variabel, alur) sudah cukup self-explanatory tanpa komentar
        historis ini.
      - >
        JANGAN ubah logic apa pun di blok ini (`ds =
        DiscoverService(discover_repo)`, dst.) -- perubahan HANYA di
        komentar.
      - >
        Tidak perlu test baru (perubahan murni komentar, tidak
        mengubah behavior) -- cukup jalankan test existing
        test_ws_discovery.py untuk memastikan tidak ada regresi dari
        typo saat edit.
    acceptance_criteria:
      - "Komentar yang menyatakan branch get_artist_detail unreachable sudah dihapus/diperbarui, tidak lagi menyesatkan pembaca kode."
      - "Tidak ada perubahan logic di ws_discovery.py."
    tests:
      run:
