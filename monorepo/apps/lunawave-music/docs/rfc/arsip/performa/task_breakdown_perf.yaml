# PETA SESI
# ---------------------------------------------------------------------------
sessions:
  - session: 0
    label: "Orientasi wajib"
    parallel_ok: false
    risk: gate
    rationale: >
      Baca temuan.md, AI_CONTEXT.md, CONSTRAINTS.md penuh; konfirmasi daftar
      locked_files_global masih akurat; petakan owner semua file yang akan
      disentuh sebelum implementasi apa pun dimulai.
    tasks: [B0.1, B0.2]

  - session: 1
    label: "Quick wins — perubahan satu-baris/satu-argumen (PERF-1, PERF-7)"
    parallel_ok: true
    risk: low
    rationale: >
      Dua file berbeda, tidak saling terkait, masing-masing perubahan
      trivial (1 argumen list / 1 baris PRAGMA). Effort/risk terendah di
      seluruh temuan — dikerjakan lebih dulu sebagai batch cepat, TAPI tetap
      didahulukan secara keseluruhan sebelum PERF-3/4/6 karena PERF-1 punya
      dampak langsung ke keluhan utama (server mati saat layar off) meski
      PERF-2 secara individual severity sama tinggi (lihat sesi 2, tabel
      prioritas temuan.md).
    patchlog_group: "1 entry gabungan untuk B1.1..B1.2"
    tasks: [B1.1, B1.2]

  - session: 2
    label: "Wake-lock server + dokumentasi setup manual HyperOS (PERF-2)"
    parallel_ok: true
    risk: medium
    rationale: >
      B2.1 (kode: modul baru bootstrap/power.py + wiring startup) dan B2.2
      (dokumentasi CONSTRAINTS.md) tidak saling depends — boleh paralel.
      Risk medium karena menyentuh startup sequence server (walau fail-safe
      dan tidak memblokir run_server()). Didahulukan setelah sesi 1 karena
      severity Tinggi dan dampak langsung ke root cause utama (proses
      dibekukan Doze/HyperOS saat layar mati).
    tasks: [B2.1, B2.2]

  - session: 3
    label: "Satu titik kontrol visibility untuk 3 rAF loop (PERF-3)"
    parallel_ok: false
    risk: medium
    rationale: >
      DEDICATED. B3.1 mengubah satu-satunya listener visibilitychange yang
      jadi titik kontrol (playback-sync.js), B3.2/B3.3 menambah guard
      self-terminating di 2 file lain yang dipanggil ulang dari titik itu —
      saling terkait erat (restart di B3.1 baru valid kalau guard di B3.2/
      B3.3 sudah ada), jadi tidak boleh diselingi task lain. B3.4 adalah gate
      self-audit sebelum sesi ini dianggap selesai, mengikuti pola R3.4 di
      RFC radio_toggle (checklist isolasi wajib sebelum lanjut).
    patchlog_group: "1 entry gabungan untuk B3.1..B3.4"
    tasks: [B3.1, B3.2, B3.3, B3.4]

  - session: 4
    label: "WebSocket client reconnect backoff (PERF-4)"
    parallel_ok: true
    risk: medium
    rationale: >
      Satu file (ws.js), independen dari sesi 3 meski sama-sama frontend —
      tidak ada overlap file maupun state. Risk medium karena menyentuh
      jalur reconnect yang kalau salah bisa bikin client tidak pernah
      reconnect sama sekali (perlu QA eksplisit di sesi 6).
    tasks: [B4.1]

  - session: 5
    label: "Prioritas CPU/IO subprocess + charging-gate loudness (PERF-6)"
    parallel_ok: false
    risk: medium
    rationale: >
      DEDICATED. Tiga file (analyzer.py, service.py, adapters/ytdlp/__init__.py)
      untuk satu temuan yang sama, saling melengkapi (nice/ionice di ffmpeg,
      charging-gate di service.py yang membungkus analyzer, setpriority di
      executor yt-dlp yang shared search+download) — dikerjakan berurutan
      dalam satu sesi supaya konsistensi pendekatan (fail-safe check,
      guard os.name) terjaga di ketiganya sekaligus.
    tasks: [B5.1, B5.2, B5.3]

  - session: 6
    label: "QA & verifikasi menyeluruh — semua PERF-1..4, 6, 7"
    parallel_ok: true
    risk: low
    rationale: >
      Murni verifikasi manual/otomatis per temuan, tidak ada perubahan kode
      produksi baru (kecuali fix kecil kalau QA menemukan masalah — kalau
      ditemukan masalah struktural, kembali ke sesi terkait, jangan tambal
      di sini). Semua task di sini depends_on sesi 1-5 selesai.
    tasks: [B6.1, B6.2, B6.3, B6.4, B6.5, B6.6, B6.7]

  - session: 7
    label: "Dokumentasi penutup + PATCHLOG"
    parallel_ok: true
    risk: low
    rationale: >
      Regenerasi index/report, update STATUS.md & CHANGELOG.md (perubahan
      ini user-facing: battery life & server stability), lalu satu entry
      PATCHLOG penutup merangkum seluruh fitur dan mereferensikan temuan.md
      + semua keputusan PD-1..PD-7.
    patchlog_group: "PATCHLOG TERPISAH untuk sesi 7 (entry penutup, bukan bagian entry per-sesi 1/3)"
    tasks: [B7.1, B7.2, B7.3]

# ---------------------------------------------------------------------------
tasks:

  # ============================================================
  # SESI 0 — Orientasi
  # ============================================================
  - id: B0.1
    title: "Baca temuan.md + governance, konfirmasi locked files"
    depends_on: []
    locked: false
    files: []
    steps:
      - "baca temuan.md penuh (semua 7 temuan + tabel prioritas)"
      - "baca AI_CONTEXT.md, konfirmasi index.html/websocket.py/controller.py masih di daftar locked persis seperti di locked_files_global file ini"
      - "baca docs/CONSTRAINTS.md §1 (Environment: Termux) — ini yang akan diupdate di B2.2"
      - "baca 2-3 entry terakhir docs/PATCHLOG.md untuk konteks sprint aktif dan nomor PATCH- terbaru"
    dod: ["locked_files_global terverifikasi akurat terhadap AI_CONTEXT.md saat ini", "nomor PATCH- berikutnya diketahui"]
    patchlog: skip

  - id: B0.2
    title: "find_owner untuk semua file yang akan disentuh sesi 1-7"
    depends_on: [B0.1]
    locked: false
    files: []
    post_commands:
      - "python automation/find_owner.py plugins/notifications.py --json"
      - "python automation/find_owner.py persistence/db.py --json"
      - "python automation/find_owner.py bootstrap/startup_tasks.py --json"
      - "python automation/find_owner.py web/static/js/audio/playback-sync.js --json"
      - "python automation/find_owner.py web/static/js/audio/visualizer.js --json"
      - "python automation/find_owner.py web/static/js/render/radio-hero-moon.js --json"
      - "python automation/find_owner.py web/static/js/render/player.js --json"
      - "python automation/find_owner.py web/static/js/ws.js --json"
      - "python automation/find_owner.py engine/loudness/analyzer.py --json"
      - "python automation/find_owner.py engine/loudness/service.py --json"
      - "python automation/find_owner.py adapters/ytdlp/__init__.py --json"
    dod: ["owner/dependency seluruh file terkait dipahami sebelum implementasi"]
    patchlog: skip

  # ============================================================
  # SESI 1 — Quick wins (parallel_ok: true)
  # ============================================================
  - id: B1.1
    feature: perf_background_battery_survival
    session: 1
    parallel_ok: true
    risk: low
    title: "PERF-1 — tambah --ongoing ke termux-notification"
    depends_on: [B0.2]
    locked: false
    files: ["plugins/notifications.py"]
    evidence: "_render() baris 142-160, list `args` tidak menyertakan --ongoing (dikonfirmasi ulang lewat grep sebelum file ini ditulis)"
    steps:
      - "tambah string \"--ongoing\" ke list `args` di dalam fungsi `_render()`"
      - "opsional: tambah \"--priority\", \"high\" di posisi setelahnya"
      - "TIDAK ubah urutan/isi argumen lain (--id, --type media, -t, -c, --media-previous/play/pause/next)"
      - "TIDAK ubah guard `shutil.which(\"termux-notification\")` di `start()` — best-effort check sudah benar"
    existing_tests: ["tests/unit/plugins/test_notifications.py"]
    post_commands:
      - "pytest tests/unit/plugins/test_notifications.py -q"
      - "grep -n '\\-\\-ongoing' plugins/notifications.py"
    dod:
      - "grep '\\-\\-ongoing' plugins/notifications.py -> muncul di dalam list args _render()"
      - "tests/unit/plugins/test_notifications.py tetap PASS (update assertion args kalau test sebelumnya cek isi list persis)"
      - "alur FIFO/callback tombol (prev/toggle/next) tidak berubah sama sekali"
    patchlog_group: session_1

  - id: B1.2
    feature: perf_background_battery_survival
    session: 1
    parallel_ok: true
    risk: low
    title: "PERF-7 — tambah PRAGMA synchronous=NORMAL"
    depends_on: [B0.2]
    locked: false
    files: ["persistence/db.py"]
    evidence: "baris 48, hanya PRAGMA journal_mode=WAL yang di-set, synchronous tidak disentuh (default SQLite = FULL)"
    steps:
      - "tambah `await self._conn.execute(\"PRAGMA synchronous=NORMAL\")` tepat SETELAH baris `PRAGMA journal_mode=WAL`"
      - "TIDAK ubah PRAGMA lain yang mungkin sudah ada di sekitar baris itu"
    existing_tests: ["tests/unit/persistence/test_db.py"]
    post_commands:
      - "pytest tests/unit/persistence/test_db.py -q"
      - "grep -n 'PRAGMA' persistence/db.py"
    dod:
      - "grep 'PRAGMA' persistence/db.py -> menampilkan journal_mode=WAL diikuti synchronous=NORMAL, urutan tsb"
      - "tests/unit/persistence/test_db.py tetap PASS"
    patchlog_group: session_1

  # ============================================================
  # SESI 2 — Wake-lock + dokumentasi manual (PERF-2)
  # ============================================================
  - id: B2.1
    feature: perf_background_battery_survival
    session: 2
    parallel_ok: true
    risk: medium
    title: "Modul bootstrap/power.py — acquire_wake_lock() fail-safe"
    depends_on: [B0.2]
    locked: false
    files:
      - "bootstrap/power.py (baru)"
      - "bootstrap/startup_tasks.py"
    evidence: >
      grep -r 'termux-wake-lock' seluruh codebase kosong. Wiring startup
      task lain (check_connectivity, _init_mpv, _resume_last_track) semua
      didaftarkan lewat safe_create_task() di run_startup_checks()
      (bootstrap/startup_tasks.py baris ~104-116) — pola yang sama dipakai
      di sini.
    steps:
      - "buat bootstrap/power.py, fungsi async `acquire_wake_lock()`"
      - "guard `if os.name == 'nt': return` di awal (no-op di Windows)"
      - "cek `shutil.which(\"termux-wake-lock\")`, kalau tidak ada: `logger.info(...)` lalu return (pola identik plugins/notifications.py `start()`)"
      - "kalau ada: `await asyncio.create_subprocess_exec(\"termux-wake-lock\", ...)` lalu `await proc.wait()`, bungkus try/except Exception -> logger.warning, JANGAN raise"
      - "di bootstrap/startup_tasks.py, import `acquire_wake_lock` dari `bootstrap.power`, tambah SATU baris di `run_startup_checks()`: `ctx.tasks.append(safe_create_task(acquire_wake_lock(), name=\"wake_lock_acquire\"))` — taruh sebelum atau sesudah connectivity_task, urutan tidak signifikan karena keduanya independen"
      - "TIDAK menambahkan termux-wake-unlock di manapun — PARTIAL wake-lock ini didesain permanen selama proses hidup (dilepas otomatis oleh OS saat proses exit), konsisten dengan tujuan (server tidak boleh mati selama masih dianggap aktif)"
    post_commands:
      - "python automation/find_owner.py bootstrap/power.py --json"
      - "python automation/doctor.py --json"
    dod:
      - "server tetap start normal di mesin tanpa termux-wake-lock (dev machine Linux/Windows/macOS) — hanya log info, tidak ada exception"
      - "run_startup_checks() tetap non-blocking (server listening tidak menunggu acquire_wake_lock() selesai)"
      - "tidak ada perubahan pada check_connectivity/_init_mpv/_resume_last_track"
    patchlog_group: session_2

  - id: B2.2
    feature: perf_background_battery_survival
    session: 2
    parallel_ok: true
    risk: low
    title: "Dokumentasi setup manual HyperOS/MIUI (langkah primer wajib)"
    depends_on: [B0.1]
