# task_breakdown_perf.yaml
# v1 — 2026-07-21
# Fitur: perf_background_battery_survival (LunaWave — Termux/Android)
# Sumber analisa: temuan.md (audit langsung ke source, bukan asumsi — 7 temuan
# PERF-1..PERF-7, konsolidasi 4 gap lama + 3 temuan baru)
# Verifikasi tambahan: seluruh klaim di temuan.md sudah di-cross-check ulang ke
# source code sebelum file ini ditulis (grep + baca langsung tiap file yang
# disebut) — lihat catatan verifikasi per task di field `evidence`.
#
# STATUS: final per temuan — bukan daftar opsi (lihat blok `decisions`).
# PENGECUALIAN: PERF-5 (§F1 di bawah, blok `future_work`) BUKAN bagian dari
# batch eksekusi ini. Statusnya deferred di temuan.md sendiri karena menyentuh
# `server/handlers/websocket.py` (governed). Jangan jalankan F1.1 sebagai
# bagian dari sesi manapun di bawah tanpa sign-off eksplisit terpisah.
#
# ATURAN EKSEKUSI UNTUK AGENT:
# 1. Ikuti `execution_order` di akhir file secara sekuensial per sesi. Task
#    dalam satu `session` dengan `parallel_ok: true` boleh dikerjakan tidak
#    berurutan relatif satu sama lain (asal depends_on terpenuhi) — tapi
#    tetap tidak boleh melompati sesi.
# 2. Blok `future_work` (F1.1 / PERF-5) TIDAK termasuk `execution_order` dan
#    TIDAK BOLEH dieksekusi bersamaan sesi 1-7 di bawah — ini keputusan
#    eksplisit dari temuan.md sendiri ("bukan untuk dieksekusi bersamaan
#    patch lain"). Kalau user memerintahkan "kerjakan semua temuan", agent
#    WAJIB berhenti dan konfirmasi ulang sebelum menyentuh F1.1 karena statusnya
#    bukan cuma governed-file-gate biasa, tapi memang belum disetujui untuk
#    dieksekusi sama sekali.
# 3. Prinsip fail-safe (RFC/temuan §Ringkasan) WAJIB dipatuhi di semua task
#    yang menyentuh binary/command eksternal Termux (termux-notification,
#    termux-wake-lock, termux-battery-status, nice, ionice): cek eksistensi
#    dulu, best-effort, log warning, JANGAN pernah crash proses kalau
#    environment tidak mendukung (mis. dev machine Linux/Windows biasa).
# 4. Setelah tiap task: jalankan `post_commands`, cek `dod` semua true, lalu
#    prepend entry `docs/PATCHLOG.md` (ID: PATCH-YYYY-MM-DD-NNN, lanjutan dari
#    latest_patch_id — cek `docs/PATCHLOG.md` frontmatter untuk nomor urut
#    terbaru sebelum menulis, JANGAN asumsikan nomor dari file ini basi kalau
#    ada commit lain masuk duluan) kecuali task punya `patchlog: skip`. Task
#    bertanda `patchlog_group` ditulis SATU entry gabungan untuk seluruh
#    anggota grup tsb.
# 5. Field `files` dengan prefix `LOCKED:` = governance-locked, tidak boleh
#    disentuh sebelum syarat konfirmasi eksplisit terpenuhi. Untuk fitur ini,
#    TIDAK ADA task di sesi 1-7 yang menyentuh file locked — kalau eksekusi
#    ternyata butuh mengubah salah satu (index.html/websocket.py/controller.py),
#    STOP, itu tanda scope sudah bergeser dari rencana ini.
# 6. Sesi dengan `parallel_ok: false` ("dedicated") wajib dikerjakan sendirian
#    tanpa task lain disisipkan di sesi yang sama.
# 7. Task yang mengubah file dengan test unit existing (lihat `existing_tests`
#    di task terkait) WAJIB jalankan test tsb sebagai bagian dari `post_commands`
#    — jangan cuma andalkan `doctor.py`, karena doctor.py tidak menjalankan
#    pytest/vitest.

meta:
  source_features: ["perf_background_battery_survival"]
  source_temuan: "temuan.md"  # dokumen sumber (diberikan berdiri sendiri, bukan file existing di docs/rfc)
  locked_files_global:
    - web/static/index.html          # AI_CONTEXT.md: final, tidak disentuh — TIDAK relevan ke fitur ini
    - engine/playback/controller.py  # AI_CONTEXT.md: risiko tinggi, closure kompleks — TIDAK relevan ke fitur ini
    - cache/admin_password.txt       # JANGAN commit — TIDAK relevan ke fitur ini
    - server/handlers/websocket.py   # governed — HANYA disentuh oleh F1.1 (future_work), TIDAK oleh sesi 1-7
  conventions:
    patchlog_id_format: "PATCH-YYYY-MM-DD-NNN"
    ai_agent_flag_required_on: [doctor.py, verify_docs.py, architecture_lint.py, verify_structure.py, find_owner.py, patchlog.py]
    ai_agent_flag: "--json"
    bundle_cmd_template: >
      zip -rq lunawave-{TASK_ID}.zip . -x ".git/*" -x "*__pycache__*"
      -x "*.pyc" -x ".pytest_cache/*" -x ".venv/*" -x "node_modules/*"
      -x "*.DS_Store" -x "lunawave-B-*.zip"

decisions:
  PD-1:
    question: "PERF-1 — tambah argumen apa ke termux-notification agar persistent?"
    chosen: "--ongoing (opsional --priority high)"
    rationale: >
      Satu argumen di list `args` dalam `_render()` (plugins/notifications.py).
      Tidak menambah dependency, tidak mengubah alur FIFO/callback existing,
      tidak mengubah guard shutil.which yang sudah menangani binary hilang.
    status: resolved

  PD-2:
    question: "PERF-2 — wake-lock otomatis dari kode cukup, atau perlu langkah manual juga?"
    chosen: "wake_lock_sekunder_plus_setup_manual_wajib"
    rationale: >
      termux-wake-lock PARTIAL ditambahkan sebagai lapisan SEKUNDER saja
      (fail-safe, cek eksistensi command dulu). Lapisan PRIMER yang wajib
      tetap konfigurasi manual level-OS HyperOS/MIUI (Autostart diizinkan +
      battery saver "No restrictions" + app di-lock di recent-apps) karena
      policy custom HyperOS bisa mengabaikan wake-lock/notification API
      standar Android. Ini didokumentasikan sebagai langkah setup wajib user
      di docs/CONSTRAINTS.md, BUKAN sesuatu yang dipaksakan otomatis dari kode.
    status: resolved

  PD-3:
    question: "PERF-3 — satu listener konsolidasi vs tiga listener terpisah untuk 3 rAF loop?"
    chosen: "satu_titik_kontrol_di_playback-sync.js"
    rationale: >
      Extend listener `visibilitychange` yang SUDAH ADA di playback-sync.js
      (satu-satunya di codebase sebelum perubahan ini) supaya jadi titik
      kontrol tunggal: cabang hidden memanggil stopProgressClock() (player.js,
      sudah idempotent), cabang visible memanggil startProgressClock() (kalau
      status PLAYING), resumeVisualizerLoop() (visualizer.js, sudah ada dan
      idempotent), dan membaca ulang dataset.on dari #radio-toggle-btn untuk
      memanggil ulang setRadioHeroAnimState() (radio-hero-moon.js) — SEMUA
      read-only terhadap state yang sudah dimiliki modul lain, tidak menulis
      store/classList apa pun (konsisten prinsip RFC radio_toggle §6: satu
      state satu pemilik). visualizer.js dan radio-hero-moon.js sendiri HANYA
      dapat guard `document.hidden` di titik reschedule rAF masing-masing
      (self-terminating), TIDAK dapat listener baru — restart tetap dari titik
      kontrol tunggal ini.
    status: resolved

  PD-4:
    question: "PERF-4 — backoff seperti apa, dan apakah reconnect timer juga butuh listener visibility sendiri?"
    chosen: "exponential_2s_4s_8s_16s_30s_cap_plus_listener_terpisah_khusus_reconnect"
    rationale: >
      Backoff: 2s → 4s → 8s → 16s → 30s (cap), reset ke 2s begitu ws.onopen
      sukses. Listener visibilitychange KEDUA di ws.js (di luar yang di
      playback-sync.js) SENGAJA dibuat terpisah — ini BUKAN pelanggaran
      prinsip PD-3, karena scope-nya beda total (reconnect network timer vs
      pause/resume rAF animasi/audio). Precedent pola sudah ada di
      playback-sync.js:144 (disebut temuan.md), tapi bukan berarti harus
      literally satu listener yang sama untuk semua concern di seluruh app.
    status: resolved

  PD-5:
    question: "PERF-5 — broadcast progress per-visibility, eksekusi sekarang atau ditunda?"
    chosen: "ditunda_future_work_perlu_signoff_terpisah"
    rationale: >
      Menyentuh server/handlers/websocket.py yang berstatus governed di
      AI_CONTEXT.md. temuan.md eksplisit menyatakan ini "future work, bukan
      untuk dieksekusi bersamaan patch lain". Didesain sebagai blok
      `future_work` terpisah (F1.1) di file ini, TIDAK masuk `execution_order`
      sesi 1-7. Butuh sign-off eksplisit tersendiri sebelum mulai dikerjakan
      sama sekali — bukan sekadar gate-per-file seperti file locked biasa.
    status: resolved  # keputusan yang di-resolve adalah "tunda", bukan "kerjakan"

  PD-6:
    question: "PERF-6 — nice/ionice untuk kedua subprocess, tapi charging-gate untuk siapa saja?"
    chosen: "nice_ionice_keduanya_charging_gate_loudness_saja"
    rationale: >
      ffmpeg (loudness analyzer) dan yt-dlp (search/resolve/download, lewat
      ThreadPoolExecutor shared di adapters/ytdlp) sama-sama dibungkus
      prioritas rendah. requiresCharging-style gating HANYA untuk loudness
      batch analysis (background, idempotent, fire-and-forget — aman ditunda).
      TIDAK untuk yt-dlp karena search/download selalu user-triggered dan
      harus responsif seketika. Guard `os.name` untuk no-op di Windows.
    status: resolved

  PD-6b:
    question: >
      (Tambahan hasil review teknis, di luar temuan.md asli) — pakai os.nice()
      (relatif) atau os.setpriority() (absolut) untuk yt-dlp worker thread?
    chosen: "os.setpriority(os.PRIO_PROCESS, 0, N) — absolut, bukan os.nice()"
    rationale: >
      adapters/ytdlp/__init__.py memakai SATU ThreadPoolExecutor(max_workers=4)
      yang di-share untuk search/extract/resolve/download (YtDlpClient facade).
      ThreadPoolExecutor MENGGUNAKAN ULANG worker thread lintas job. Kalau
      pakai os.nice() (relatif/kumulatif) di setiap job, niceness worker
      thread itu akan terus NAIK setiap kali thread yang sama kebagian job
      baru (10 → 20 → 30 → ...) sampai akhirnya starvation — bug tersembunyi
      yang tidak disebut di temuan.md asli. os.setpriority(PRIO_PROCESS, 0, N)
      bersifat absolut/idempotent per pemanggilan, jadi aman dipanggil
      berulang di worker thread yang sama. Berlaku juga untuk analyzer.py
      kalau nanti niat diubah dari subprocess nice/ionice ke setpriority
      Python-level, tapi untuk analyzer.py solusi command-line nice/ionice
      (PD-6) tetap dipertahankan karena itu proses subprocess terpisah, bukan
      dalam-proses seperti yt-dlp.
    status: resolved

  PD-7:
    question: "PERF-7 — PRAGMA synchronous level apa?"
    chosen: "NORMAL"
    rationale: >
      Ditambahkan tepat setelah `PRAGMA journal_mode=WAL` di persistence/db.py.
      Kombinasi WAL + synchronous=NORMAL didokumentasikan resmi SQLite sebagai
      aman — mengurangi fsync per-commit, risiko residual (transaksi terakhir
      hilang saat power-loss murni, bukan korupsi) bisa diterima untuk data
      non-finansial (play count/riwayat/posisi).
    status: resolved

