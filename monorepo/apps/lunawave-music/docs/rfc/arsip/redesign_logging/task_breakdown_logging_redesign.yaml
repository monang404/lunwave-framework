# task_breakdown_logging_redesign.yaml
# v1 — 2026-07-23
# Fitur: entrypoint_dashboard_redesign (redesain start.bat/start.sh/start.py/
# main.py + dashboard web untuk observability, TANPA mengubah arsitektur
# logging inti yang sudah ada)
# Sumber proposal: PROPOSAL-Redesign-Logging-Dashboard-LunaWave.md (§3 Sistem
# yang Diusulkan, §4 Tahapan Implementasi)
# Sumber baseline logging: core/log_config.py, core/log_categories.py,
# core/observability.py (sudah final, TIDAK diubah taksonominya)
# Sumber RFC terkait (berjalan paralel, tidak boleh saling tabrak):
# docs/rfc/observability_logging/observability_logging.md (status PLANNING)
#
# STATUS: final — semua keputusan desain (autentikasi dashboard, strategi
# live-tail, format parser log, pola registrasi route) sudah disepakati di
# blok `decisions` di bawah. Tidak ada keputusan produk baru yang perlu
# diambil; file ini murni urutan eksekusi. Satu-satunya gate manusia: task
# R6.2 (menyentuh server/handlers/websocket.py, file locked di AI_CONTEXT.md).
#
# ATURAN EKSEKUSI UNTUK AGENT:
# 1. Ikuti `execution_order` di akhir file secara sekuensial per sesi. Task
#    dalam satu `session` dengan `parallel_ok: true` boleh dikerjakan tidak
#    berurutan relatif satu sama lain (asal depends_on terpenuhi) — tapi
#    tetap tidak boleh melompati sesi.
# 2. Sesi 2, 3, 4, 5, 6 WAJIB dedicated (parallel_ok: false) karena
#    masing-masing menyentuh file bersama/sensitif (launcher entrypoint,
#    main.py, server/app.py, server/handlers/websocket.py) secara
#    berurutan — menyisipkan task lain di sesi yang sama berisiko konflik
#    edit pada file yang sama.
# 3. Jangan eksekusi task dengan `requires_human_confirmation: true` tanpa
#    berhenti dan meminta konfirmasi eksplisit user PERSIS sebelum task itu.
#    `server/handlers/websocket.py` ada di AI_CONTEXT.md sebagai file
#    "jangan dipecah/direstrukturisasi tanpa persetujuan eksplisit" — task
#    R6.2 HANYA boleh menambah satu percabangan dispatch baru, tidak lebih.
# 4. Prinsip non-negotiable dari proposal §3.3 (dashboard read-only, tidak
#    pernah menampilkan payload mentah/kredensial) WAJIB dipatuhi di semua
#    task sesi 5-7, konsisten dengan LOGGING_STANDARD.md §8 (rahasia tidak
#    pernah masuk log/tampilan).
# 5. Setelah tiap task: jalankan `post_commands`, cek `dod` semua true, lalu
#    prepend entry `docs/PATCHLOG.md` (ID: PATCH-YYYY-MM-DD-NNN — cek
#    frontmatter `latest_patch_id` untuk nomor urut terbaru SEBELUM menulis,
#    saat ini PATCH-2026-07-23-187 / total_entries 187) kecuali task punya
#    `patchlog: skip`. Task bertanda `patchlog_group` ditulis SATU entry
#    gabungan untuk seluruh anggota grup tsb.
# 6. Field `files` dengan prefix `CAUTION:` = file berisiko tinggi atau
#    sensitif menurut AI_CONTEXT.md/docs/STATUS.md, butuh review ekstra
#    hati-hati sebelum commit (lihat aturan 3).
# 7. Sesi dengan `parallel_ok: false` ("dedicated") wajib dikerjakan sendirian
#    tanpa task lain disisipkan di sesi yang sama.
# 8. Non-breaking per commit: tiap task harus meninggalkan aplikasi dalam
#    keadaan berjalan normal (server tetap bisa start, player tetap bisa
#    diputar) — dilarang "big bang" menggabungkan backend+frontend+wiring
#    dashboard dalam satu commit di luar scope task ybs.
# 9. Dashboard dan endpoint `/api/logs/*` WAJIB memakai proteksi akses yang
#    sama seperti `/metrics` (localhost atau `X-Metrics-Token` dengan
#    `secrets.compare_digest`) SEJAK task pertama yang membuatnya — bukan
#    ditambah belakangan (lihat R-D1 dan proposal §5 "Risiko keamanan").
# 10. Dilarang mengubah taksonomi 15 kategori di core/log_categories.py atau
#     format `file_renderer()`/`lunawave.log` sebagai bagian dari fitur ini —
#     fitur ini murni lapisan penyajian (baca proposal §3.1 prinsip #1).

meta:
  source_features: ["entrypoint_dashboard_redesign"]
  source_proposal: "PROPOSAL-Redesign-Logging-Dashboard-LunaWave.md"
  source_logging_baseline:
    - "core/log_config.py"
    - "core/log_categories.py"
    - "core/observability.py"
  source_rfc_parallel: "docs/rfc/observability_logging/observability_logging.md"
  locked_files_global:
    - web/static/index.html          # AI_CONTEXT.md: "tidak dipecah, ini keputusan final" — dashboard log adalah HALAMAN BARU terpisah (admin-logs.html), tidak menyentuh file ini
    - server/handlers/websocket.py   # AI_CONTEXT.md: jangan dipecah/direstrukturisasi tanpa persetujuan eksplisit — task di file ini (R6.2) hanya boleh MENAMBAH satu percabangan dispatch baru, mengikuti pola ws_queue.py/ws_playback.py yang sudah ada
  caution_files_global:
    - server/app.py                  # wiring rute pusat aplikasi — disentuh 2x oleh fitur ini (R5.2 dan bagian dari R5.2 untuk /admin/logs), tiap edit harus minimal dan additive (add_get baru saja, tidak menata ulang urutan rute lain)
    - server/connection_manager.py   # dipakai player utama (ws) dan sekarang juga log-viewer (R6.3) — perubahan harus terbukti tidak mengganggu ACTIVE_WEBSOCKETS/durasi sesi player yang sudah diinstrumentasi
  conventions:
    patchlog_id_format: "PATCH-YYYY-MM-DD-NNN"
    ai_agent_flag_required_on: [doctor.py, verify_docs.py, architecture_lint.py, verify_structure.py, find_owner.py, patchlog.py]
    ai_agent_flag: "--json"
    dashboard_auth_pattern: >
      Semua endpoint baru (/api/logs/tail, /api/logs/stats, /admin/logs)
      memakai fungsi proteksi yang SAMA dengan server/handlers/http.py
      serve_metrics() — is_local (127.0.0.1/::1) ATAU header
      X-Metrics-Token yang valid via secrets.compare_digest(). Tidak ada
      env var token baru; reuse LUNAWAVE_METRICS_TOKEN yang sudah ada.
    bundle_cmd_template: >
      zip -rq lunawave-{TASK_ID}.zip . -x ".git/*" -x "*__pycache__*"
      -x "*.pyc" -x ".pytest_cache/*" -x ".venv/*" -x "node_modules/*"
      -x "*.DS_Store" -x "lunawave-R-*.zip"

decisions:
  R-D1:
    question: "Dashboard log dan /api/logs/* pakai sistem autentikasi baru, atau reuse proteksi /metrics yang sudah ada?"
    chosen: "reuse_metrics_token"
    rationale: >
      Proposal §3.1 prinsip #4 dan §3.3 eksplisit: dashboard harus
      "aman-default" mengikuti pola /metrics yang sudah terbukti dipakai
      (localhost atau X-Metrics-Token + secrets.compare_digest). Membuat
      sistem auth baru menambah permukaan risiko tanpa manfaat tambahan,
      dan melanggar non-goal "tidak menambah dependency baru / env var
      baru" yang sudah jadi prinsip di RFC observability_logging.md.
    status: resolved
  R-D2:
    question: "Live tail dikirim per baris (push tiap event log terjadi) atau dikumpulkan dulu (batched)?"
    chosen: "batched_500ms"
    rationale: >
      Proposal §5 "Risiko performa" mewajibkan live tail dibatasi rate
      (contoh: batching per 500ms) supaya tidak membanjiri client saat log
      sangat ramai (mis. radio_filter menghasilkan banyak baris DEBUG
      dalam waktu singkat). Batching dilakukan di server/handlers/
      ws_log_stream.py (R6.1), bukan di client, supaya perilaku sama untuk
      semua jenis client (browser dashboard maupun kelak GUI launcher).
    status: resolved
  R-D3:
    question: "Parser untuk /api/logs/tail baca lunawave.log via regex terhadap format file_renderer() yang sudah ada, atau format logging diubah jadi JSON Lines dual-output?"
    chosen: "regex_terhadap_file_renderer_existing"
    rationale: >
      Aturan eksekusi #10 dan prinsip desain proposal §3.1 #1: fitur ini
      TIDAK BOLEH mengubah arsitektur logging inti. Format
      `[HH:MM:SS] LEVEL: event (k=v, ...)` dari file_renderer() di
      core/log_config.py sudah stabil dan dapat diprediksi — cukup satu
      regex per baris di core/log_reader.py (R1.1). Mengubah ke JSONL
      berarti mengubah kontrak core/log_config.py, di luar scope, dan
      berisiko bentrok dengan RFC observability_logging.md yang sedang
      berjalan paralel (status PLANNING).
    status: resolved
  R-D4:
    question: "Rute baru (/api/logs/tail, /api/logs/stats, /admin/logs) didaftarkan langsung di server/app.py, atau lewat sub-router terpisah?"
    chosen: "penambahan_langsung_pola_existing"
    rationale: >
      server/app.py saat ini 100% memakai pola flat `app.router.add_get(...)`
      untuk semua 8 rute yang ada (lihat create_app()) — tidak ada
      preseden sub-router di codebase ini. Menambah sub-router baru hanya
      untuk 3 rute dashboard akan jadi inkonsistensi arsitektur yang tidak
      perlu (dan menambah permukaan review). R5.2 menambah 3 baris
      add_get baru mengikuti pola yang sudah ada, ditempatkan bersebelahan
      dengan /health dan /metrics yang secara fungsi paling dekat.
    status: resolved
  R-D5:
    question: "server/handlers/websocket.py (locked file) — bagaimana menambah tipe pesan log_tail tanpa direstrukturisasi?"
    chosen: "modul_terpisah_plus_satu_dispatch_branch"
    rationale: >
      AI_CONTEXT.md melarang memecah/merestrukturisasi file ini tanpa izin
      eksplisit. Codebase SUDAH punya preseden untuk pola ini:
      ws_queue.py, ws_playback.py, ws_discovery.py, ws_download.py masing-
      masing modul terpisah per fitur, diimpor dan dipanggil dari satu
      percabangan di websocket.py. R6.1 membuat server/handlers/
      ws_log_stream.py mengikuti pola yang identik; R6.2 HANYA menambah
      satu `elif`/pemanggilan baru ke handler tsb di websocket.py, nol
      perubahan struktur lain.
    status: resolved

