# ---------------------------------------------------------------------------
tasks:

  # ---------- ORIENTASI ----------
  - id: R0.1
    title: "Baca proposal + baseline logging + governance, cek owner file terkait"
    depends_on: []
    locked: false
    files: []
    steps:
      - "baca PROPOSAL-Redesign-Logging-Dashboard-LunaWave.md penuh (khususnya §3-§5)"
      - "baca core/log_config.py, core/log_categories.py, core/observability.py — pahami kontrak yang TIDAK BOLEH berubah"
      - "baca docs/rfc/observability_logging/observability_logging.md — pastikan tidak ada tumpang tindih task dengan RFC yang sedang berjalan (mis. server_clock.py, mem_stats.py sudah/akan dibuat RFC lain, jangan dibuat ulang di sini)"
      - "baca AI_CONTEXT.md, konfirmasi status server/handlers/websocket.py (locked) dan web/static/index.html (locked)"
      - "baca 2-3 entry terakhir docs/PATCHLOG.md untuk konteks sprint aktif"
    post_commands:
      - "python automation/find_owner.py server/app.py --json"
      - "python automation/find_owner.py server/handlers/websocket.py --json"
      - "python automation/find_owner.py server/connection_manager.py --json"
      - "python automation/find_owner.py launcher/dep_checker.py --json"
      - "python automation/find_owner.py core/observability.py --json"
    dod: ["owner/dependency file infrastruktur yang akan disentuh dipahami sebelum implementasi, dan tidak ada tumpang tindih dengan RFC observability_logging.md yang sedang berjalan"]
    patchlog: skip

  # ============================================================
  # SESI 1 — Infrastruktur bersama (parallel_ok: true)
  # ============================================================
  - id: R1.1
    feature: entrypoint_dashboard_redesign
    session: 1
    parallel_ok: true
    title: "Buat core/log_reader.py — parser lunawave.log + tail() + stats()"
    depends_on: [R0.1]
    locked: false
    files: ["core/log_reader.py (baru)"]
    steps:
      - "tambah regex parser untuk satu baris file_renderer(): `[HH:MM:SS] LEVEL: event (k=v, k2=v2, ...)` -> dict {time, level, event, fields}"
      - "tambah fungsi tail(limit=200, category=None, level=None, query=None) — baca lunawave.log dari akhir (termasuk 2 file backup rotasi .1/.2 bila limit belum terpenuhi dari file utama), filter sesuai parameter"
      - "tambah fungsi stats(window_seconds=3600) — hitung jumlah baris per level dan per category dalam window waktu tsb, dari isi yang sudah di-parse"
      - "baris yang gagal di-parse (mis. baris banner SESSION START/END) TETAP disertakan sebagai entry dengan level=\"BANNER\", tidak di-drop diam-diam"
      - "tambah unit test: parser terhadap sample baris log realistis (termasuk baris dengan banyak field dan baris banner), test tail() dengan filter kombinasi category+level+query, test stats() menghasilkan angka benar untuk input sintetis"
    dod:
      - "parser mengembalikan dict lengkap (time, level, event, fields) untuk baris log standar dan menandai baris banner secara eksplisit, bukan meng-crash atau melewatkannya"
      - "tail() mendukung filter category/level/query secara independen maupun kombinasi, teruji dengan unit test"
      - "stats() menghasilkan agregat yang benar untuk input sintetis, teruji dengan unit test"
      - "modul ini belum dipanggil dari mana pun (murni infrastruktur, tidak ada perubahan behavior aplikasi)"

  - id: R1.2
    feature: entrypoint_dashboard_redesign
    session: 1
    parallel_ok: true
    title: "Tambah core/observability.py — get_counter_value() helper baca-saja"
    depends_on: [R1.1]
    locked: false
    files: ["core/observability.py"]
    steps:
      - "tambah fungsi get_counter_value(metric, **label_kwargs) -> float — baca nilai kumulatif Counter/Histogram Prometheus yang sudah ada (HTTP_REQUESTS_TOTAL, COMMAND_COUNT, dst) tanpa mengubah definisi metric manapun"
      - "gunakan API publik prometheus_client (collect()/samples) untuk membaca nilai, BUKAN mengakses atribut privat (`_value`) — supaya tidak rapuh terhadap perubahan versi library"
      - "fail-safe: kembalikan 0.0 dan JANGAN raise bila metric belum punya sample sama sekali (mis. server baru start, belum ada request)"
      - "tambah unit test: get_counter_value pada metric yang sudah di-increment vs metric kosong"
    post_commands: ["python automation/find_owner.py core/observability.py --json"]
    dod:
      - "get_counter_value() mengembalikan angka benar untuk metric yang sudah di-increment, dan 0.0 (bukan exception) untuk metric kosong"
      - "5 metric Counter/Histogram/Gauge yang sudah ada di file ini TIDAK berubah definisinya sama sekali (nama, label, help text identik dengan sebelum task ini)"
    patchlog_group: session_1
    bundle_cmd: 'zip -rq lunawave-R1.2.zip . -x ".git/*" -x "*__pycache__*" -x "*.pyc" -x ".pytest_cache/*" -x ".venv/*" -x "node_modules/*" -x "*.DS_Store" -x "lunawave-R-*.zip"'

  # ============================================================
  # SESI 2 — Preflight check terpadu (DEDICATED)
  # ============================================================
  - id: R2.1
    feature: entrypoint_dashboard_redesign
    session: 2
    parallel_ok: false
    risk: medium
    title: "Perluas launcher/dep_checker.py — tambah cek port & versi MPV"
    depends_on: [R0.1]
    locked: false
    files: ["launcher/dep_checker.py"]
    steps:
      - "DependencyChecker.check_dependencies() TETAP tidak berubah signature/return-nya (dipakai launcher/gui/app.py, jangan pecah kontrak existing)"
      - "tambah method baru check_port(host, port) -> bool — deteksi port sudah terpakai proses lain sebelum boot, memakai socket standar (tidak ada dependency baru)"
      - "tambah method baru mpv_version() -> str | None — parse `mpv --version` bila mpv ditemukan, None bila gagal/tidak ada (fail-safe, tidak melempar exception)"
      - "tambah unit test untuk dua method baru: check_port pada port yang sengaja dibuka test vs port bebas, mpv_version terhadap output mpv yang di-mock"
    post_commands: ["python automation/find_owner.py launcher/gui/app.py --json"]
    dod:
      - "check_dependencies() existing tidak berubah perilaku/return type — dikonfirmasi test lama (bila ada) masih hijau"
      - "check_port() dan mpv_version() baru, teruji unit test, fail-safe (tidak pernah melempar exception ke pemanggil)"
    bundle_cmd: 'zip -rq lunawave-R2.1.zip . -x ".git/*" -x "*__pycache__*" -x "*.pyc" -x ".pytest_cache/*" -x ".venv/*" -x "node_modules/*" -x "*.DS_Store" -x "lunawave-R-*.zip"'

  - id: R2.2
    feature: entrypoint_dashboard_redesign
    session: 2
    parallel_ok: false
    risk: medium
    title: "Buat launcher/preflight.py — orkestrator satu sumber kebenaran"
    depends_on: [R2.1]
    locked: false
    files: ["launcher/preflight.py (baru)"]
    steps:
      - "buat fungsi run(host, port) yang memanggil DependencyChecker (R2.1: check_dependencies, check_port, mpv_version) secara berurutan"
      - "tiap langkah dicetak ke stdout (format yang sama seperti output start.bat/start.sh saat ini: `[*] ...`, `[+] ...`, `[-] ...`) DAN dicatat ke lunawave.log via structlog: event preflight_check, category=LC_LIFECYCLE, field check, result"
      - "panggil setup_logging() di awal preflight.py SEBELUM mencatat apa pun, supaya baris preflight juga masuk lunawave.log meski main.py belum jalan (fail-safe bila setup_logging gagal: tetap lanjut cetak ke stdout saja)"
      - "exit code preflight: 0 bila semua check lolos (atau hanya warning non-fatal), 1 bila ada kegagalan fatal (belum tentu mem-block start, mengikuti perilaku start.bat/start.sh saat ini yang tetap lanjut dengan warning untuk deps/MPV)"
      - "CLI: `python -m launcher.preflight --host <h> --port <p>`"
      - "tambah unit test: preflight.run() dengan DependencyChecker di-mock (semua lolos vs sebagian gagal), verifikasi baris log ditulis dengan category yang benar"
    post_commands:
      - "python -m launcher.preflight --host 127.0.0.1 --port 8765"
      - "python automation/doctor.py --json"
