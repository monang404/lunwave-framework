# task_breakdown_radio.yaml
# v1 — 2026-07-20
# Fitur: radio_toggle_redesign ("Night Dial" — bulan sabit sebagai tuner radio)
# Sumber analisa: docs/rfc/radio_toggle.md (RFC, root cause + rencana lengkap)
# Sumber desain: lunawave-hero-creative-v8.html (mockup standalone, sudah tidak
# ada di repo — hasil porting dituliskan langsung sebagai steps di bawah)
#
# STATUS: final — seluruh keputusan produk di blok `decisions` sudah disetujui
# user (2026-07-20). Satu-satunya persetujuan manusia yang masih diperlukan:
# gate file governance-locked (aturan 2 di bawah, sesi 4).
#
# ATURAN EKSEKUSI UNTUK AGENT:
# 1. Ikuti `execution_order` di akhir file secara sekuensial per sesi. Task
#    dalam satu `session` dengan `parallel_ok: true` boleh dikerjakan tidak
#    berurutan relatif satu sama lain (asal depends_on terpenuhi) — tapi
#    tetap tidak boleh melompati sesi.
# 2. Jangan eksekusi task dengan `locked: true` tanpa berhenti dan meminta
#    konfirmasi eksplisit dari user PERSIS sebelum task itu. `web/static/index.html`
#    ada di `AI_CONTEXT.md` sebagai file yang tidak boleh disentuh tanpa izin.
# 3. Prinsip non-negotiable dari RFC §6 WAJIB dipatuhi di semua task JS
#    (khususnya sesi 3 dan 5) — satu state, satu pemilik. Lihat catatan di
#    tiap task terkait dan checklist isolasi di R3.4/R6.5.
# 4. Setelah tiap task: jalankan `post_commands`, cek `dod` semua true, lalu
#    prepend entry `docs/PATCHLOG.md` (ID: PATCH-YYYY-MM-DD-NNN) kecuali task
#    punya `patchlog: skip`. Task bertanda `patchlog_group` ditulis SATU
#    entry gabungan untuk seluruh anggota grup tsb.
# 5. Field `files` dengan prefix `LOCKED:` = governance-locked, tidak boleh
#    disentuh sebelum syarat aturan 2 terpenuhi.
# 6. Sesi dengan `parallel_ok: false` ("dedicated") wajib dikerjakan sendirian
#    tanpa task lain disisipkan di sesi yang sama.
# 7. Sebelum sesi 7 (cleanup CSS lama), WAJIB grep ulang dependency
#    `.radio-featured`/`.centerpiece-*`/`.radio-live-badge` (lihat RFC §5.2) —
#    kode bisa saja berubah sejak RFC ditulis.

meta:
  source_features: ["radio_toggle_redesign"]
  source_rfc: "docs/rfc/radio_toggle.md"
  locked_files_global:
    - web/static/index.html      # AI_CONTEXT.md: tidak boleh disentuh tanpa izin eksplisit
    - server/handlers/websocket.py  # tidak relevan ke fitur ini, jangan disentuh
    - engine/playback/controller.py # tidak relevan ke fitur ini, jangan disentuh
  conventions:
    patchlog_id_format: "PATCH-YYYY-MM-DD-NNN"
    ai_agent_flag_required_on: [doctor.py, verify_docs.py, architecture_lint.py, verify_structure.py, find_owner.py, patchlog.py]
    ai_agent_flag: "--json"
    bundle_cmd_template: >
      zip -rq lunawave-{TASK_ID}.zip . -x ".git/*" -x "*__pycache__*"
      -x "*.pyc" -x ".pytest_cache/*" -x ".venv/*" -x "node_modules/*"
      -x "*.DS_Store" -x "lunawave-T-*.zip" -x "lunawave-R-*.zip"

decisions:
  R-D1:
    question: "Label nama kartu: branding 'LunaWave' atau fungsional 'Radio Mode'?"
    chosen: "Radio Mode"
    rationale: "User memilih label fungsional, konsisten dengan copy badge status baru (Radio On/Radio Off)."
    status: resolved
  R-D2:
    question: "Copy badge status: 'LIVE'/'ON AIR' (mockup) atau alternatif lain?"
    chosen: "Radio On / Radio Off"
    rationale: >
      Dua string berbeda per state (bukan satu badge yang muncul/hilang seperti
      mockup asli). Konsekuensi desain: badge WAJIB selalu terlihat di kedua
      state (tidak boleh fully-hidden saat off seperti .onair-tag di mockup),
      cuma teks + treatment visualnya yang berubah. Diimplementasikan sebagai
      dua <span> (off-text/on-text) yang saling exclusive lewat CSS class
      .radio-hero.on — BUKAN lewat textContent JS, supaya tetap konsisten
      dengan prinsip RFC §6 (satu state satu pemilik, radio-tab.js tetap
      satu-satunya penulis class on/off).
    status: resolved
  R-D3:
    question: "Font display (Fraunces italic serif untuk nama): font sistem atau self-host?"
    chosen: "self_host"
    rationale: >
      User memilih self-host demi look distinctive dari mockup, menerima
      trade-off nambah 2 font family baru (Fraunces, Space Grotesk) ke aset
      project — TIDAK boleh via CDN (fonts.googleapis.com), harus file lokal
      di web/static/fonts/ + @font-face, sesuai constraint self-hosted app
      (Termux/offline) di CONSTRAINTS.md & AI_CONTEXT.md.
    status: resolved
  R-D4:
    question: "Ukuran final kartu: height: 322px dari mockup dikunci langsung, atau disesuaikan dulu ke layout nyata?"
    chosen: "322px_final_dengan_qa_wajib"
    rationale: >
      User mengonfirmasi 322px final — tidak perlu iterasi ukuran lagi. Tetap
      wajib ada task QA eksplisit (R6.2) untuk viewport tersempit yang
      didukung (breakpoint di platform/mobile.css & platform/landscape.css),
      supaya kalau ternyata overflow di device tertentu, itu jadi bug report
      terpisah, bukan re-buka keputusan produk ini.
    status: resolved

