    label: "Font self-host + fondasi token CSS"
    parallel_ok: true
    risk: low
    rationale: >
      Murni aset statis (font file) + deklarasi CSS variable/@font-face di
      file baru. Tidak menyentuh file lain, tidak ada logika. Boleh
      dikerjakan tidak berurutan antar sub-task.
    patchlog_group: "1 entry gabungan untuk R1.1..R1.2 (aset belum dipakai UI manapun)"
    tasks: [R1.1, R1.2]

  - session: 2
    label: "CSS komponen radio-hero.css"
    parallel_ok: false
    risk: low
    rationale: >
      DEDICATED. Satu file (radio-hero.css) dibangun bertahap (container,
      starfield, moon SVG, badge/teks), tiap sub-task saling menambah ke file
      yang sama — hindari konflik dengan menjaganya jadi satu sesi.
    patchlog_group: "1 entry gabungan untuk R2.1..R2.4"
    tasks: [R2.1, R2.2, R2.3, R2.4]

  - session: 3
    label: "Modul JS radio-hero-moon.js (self-contained)"
    parallel_ok: false
    risk: medium
    rationale: >
      DEDICATED. Ini bagian paling kritis untuk mencegah regresi lama
      (RFC §3 — dugaan playback_sync error). Dibangun bertahap dalam satu
      sesi supaya prinsip isolasi (RFC §5.3/§6) bisa diverifikasi utuh
      sebelum modul ini disambungkan ke apa pun (R3.4 adalah gate internal
      sebelum lanjut ke sesi 4).
    patchlog_group: "1 entry gabungan untuk R3.1..R3.4 (modul belum di-load index.html, belum reachable)"
    tasks: [R3.1, R3.2, R3.3, R3.4]

  - session: 4
    label: "Gate — markup & includes di index.html"
    parallel_ok: false
    risk: gate
    rationale: >
      DEDICATED, WAJIB. index.html governance-locked (AI_CONTEXT.md). Satu
      sesi ini mencakup SEMUA perubahan index.html yang dibutuhkan fitur ini
      sekaligus (markup #radio-toggle-btn baru + <link> radio-hero.css +
      <script> radio-hero-moon.js) — supaya file locked ini cuma disentuh
      SATU kali untuk seluruh fitur, bukan berkali-kali di sesi terpisah.
    tasks: [R4.1]

  - session: 5
    label: "Wiring renderRadio() -> modul animasi"
    parallel_ok: false
    risk: medium
    rationale: >
      DEDICATED. Menyentuh radio-tab.js yang jadi satu-satunya pemilik state
      on/off (RFC §5.3) — perubahan kecil (1 hook call) tapi di file
      sensitif secara behavior, tidak digabung task lain.
    tasks: [R5.1]

  - session: 6
    label: "QA & verifikasi isolasi"
    parallel_ok: true
    risk: low
    rationale: >
      Murni verifikasi manual/otomatis, tidak ada perubahan kode produksi
      (kecuali fix kecil kalau QA menemukan masalah — jika ditemukan
      masalah struktural, kembali ke sesi terkait, jangan tambal di sini).
    tasks: [R6.1, R6.2, R6.3, R6.4, R6.5, R6.6]

  - session: 7
    label: "Cleanup CSS lama + dokumentasi penutup"
    parallel_ok: true
    risk: low
    rationale: >
      Penutup: hapus style `.radio-featured` lama dari cards.css setelah
      dependency-check ulang, lalu regenerasi index/patchlog.
    patchlog_group: "PATCHLOG TERPISAH untuk sesi 7 (pembersihan, bukan bagian entry fitur utama)"
    tasks: [R7.1, R7.2, R7.3]

