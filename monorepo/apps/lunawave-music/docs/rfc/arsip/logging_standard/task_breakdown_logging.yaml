# task_breakdown_logging.yaml
# v1 — 2026-07-22
# Fitur: logging_standard_migration (structured logging: category/component/
# correlation/event-key, sesuai LOGGING_STANDARD.md)
# Sumber standar: docs/rfc/logging_standard/LOGGING_STANDARD.md (spesifikasi target)
# Sumber gap: docs/rfc/logging_standard/logging_audit.md (kondisi saat ini, 146 file
# .py, ~17.9k baris, 44 file logging, ~111 call logger)
# Sumber rencana: docs/rfc/logging_standard/implementasi_plan_logging_advance.md
# (Fase 0-7, diterjemahkan jadi sesi 1-9 di bawah)
#
# STATUS: final — semua keputusan desain (severity, kategori, field, event key)
# sudah disepakati di LOGGING_STANDARD.md dan implementasi_plan_logging_advance.md.
# Tidak ada keputusan produk baru yang perlu diambil; file ini murni urutan
# eksekusi migrasi. Satu-satunya gate manusia: task L7.4 (menyentuh
# engine/playback/controller.py, ditandai "risiko tinggi" di AI_CONTEXT.md).
#
# ATURAN EKSEKUSI UNTUK AGENT:
# 1. Ikuti `execution_order` di akhir file secara sekuensial per sesi. Task
#    dalam satu `session` dengan `parallel_ok: true` boleh dikerjakan tidak
#    berurutan relatif satu sama lain (asal depends_on terpenuhi) — tapi
#    tetap tidak boleh melompati sesi.
# 2. Sesi 3 (L3.x) WAJIB dikerjakan berurutan sesuai urutan file di
#    implementasi_plan §4.1 (dari call logger paling sedikit ke paling
#    banyak) — tujuannya memvalidasi pola component/category di file kecil
#    dulu sebelum diterapkan ke 37 file sisanya di sesi 4.
# 3. Jangan eksekusi task dengan `requires_human_confirmation: true` tanpa
#    berhenti dan meminta konfirmasi eksplisit user PERSIS sebelum task itu.
#    `engine/playback/controller.py` ada di AI_CONTEXT.md sebagai file
#    "risiko tinggi, closure kompleks" — bukan governance-locked seperti
#    index.html, tapi tetap butuh kehati-hatian ekstra.
# 4. Prinsip non-negotiable dari LOGGING_STANDARD.md §8 (rahasia tidak
#    pernah masuk log) WAJIB dipatuhi di SEMUA task, khususnya sesi 2
#    (auth.py) — dilarang keras menulis field password/token/stored_hash
#    dalam bentuk apa pun, termasuk di level DEBUG.
# 5. Setelah tiap task: jalankan `post_commands`, cek `dod` semua true, lalu
#    prepend entry `docs/PATCHLOG.md` (ID: PATCH-YYYY-MM-DD-NNN — cek
#    frontmatter `latest_patch_id` untuk nomor urut terbaru SEBELUM menulis)
#    kecuali task punya `patchlog: skip`. Task bertanda `patchlog_group`
#    ditulis SATU entry gabungan untuk seluruh anggota grup tsb.
# 6. Field `files` dengan prefix `CAUTION:` = file berisiko tinggi menurut
#    AI_CONTEXT.md, tidak governance-locked tapi butuh review ekstra hati-hati
#    sebelum commit (lihat aturan 3).
# 7. Sesi dengan `parallel_ok: false` ("dedicated") wajib dikerjakan sendirian
#    tanpa task lain disisipkan di sesi yang sama, karena tiap sub-task
#    menambah ke pola/file yang sama secara bertahap.
# 8. Non-breaking per commit (prinsip migrasi #3 di implementasi_plan): tiap
#    task harus meninggalkan aplikasi dalam keadaan berjalan normal — dilarang
#    "big bang" ganti banyak call logger sekaligus di luar scope task ybs.
# 9. DILARANG log-and-swallow tanpa error_type (anti-pattern §12.4), dan
#    DILARANG duplikasi log exception yang sama di banyak lapisan tanpa
#    informasi baru (anti-pattern §12.5) — lihat sesi 8 (L8.1) untuk
#    pembersihan pola ini yang sudah ada.

meta:
  source_features: ["logging_standard_migration"]
  source_rfc: "docs/rfc/logging_standard/LOGGING_STANDARD.md"
  source_audit: "docs/rfc/logging_standard/logging_audit.md"
  source_plan: "docs/rfc/logging_standard/implementasi_plan_logging_advance.md"
  locked_files_global:
    - web/static/index.html          # AI_CONTEXT.md: tidak boleh disentuh tanpa izin eksplisit — tidak relevan ke fitur ini
    - server/handlers/websocket.py   # AI_CONTEXT.md: jangan dipecah/direfactor tanpa persetujuan eksplisit — task logging di file ini (jika ada) hanya boleh MENAMBAH log, bukan restrukturisasi
  caution_files_global:
    - engine/playback/controller.py  # AI_CONTEXT.md: "risiko tinggi, closure kompleks" — bukan locked, tapi wajib requires_human_confirmation sebelum disentuh (lihat L7.4)
  conventions:
    patchlog_id_format: "PATCH-YYYY-MM-DD-NNN"
    ai_agent_flag_required_on: [doctor.py, verify_docs.py, architecture_lint.py, verify_structure.py, find_owner.py, patchlog.py]
    ai_agent_flag: "--json"
    bundle_cmd_template: >
      zip -rq lunawave-{TASK_ID}.zip . -x ".git/*" -x "*__pycache__*"
      -x "*.pyc" -x ".pytest_cache/*" -x ".venv/*" -x "node_modules/*"
      -x "*.DS_Store" -x "lunawave-T-*.zip" -x "lunawave-R-*.zip"

decisions:
  L-D1:
    question: "Logger diikat per komponen logis atau per nama modul Python (__name__)?"
    chosen: "per_komponen_logis"
    rationale: >
      LOGGING_STANDARD.md §4 anti-pattern #7 melarang kategori/nama logger
      mengikuti path file. `structlog.get_logger(component=<nama_logis>)`
      dipilih (bukan bind per-call yang diulang ratusan kali) karena mengikat
      sekali per modul dan menutup G11 sekaligus. Nilai component mengikuti
      contoh §5.1 (playback.controller, radio.engine, ws.auth, dst),
      independen dari path file.
    status: resolved
  L-D2:
    question: "auth_login_rejected pakai level INFO atau WARNING?"
    chosen: "INFO"
    rationale: >
      Satu percobaan login gagal adalah kejadian normal yang diharapkan
      terjadi sesekali (§3 definisi INFO: progres alur bisnis yang sah).
      WARNING baru dipakai saat ambang rate-limit terlampaui
      (auth_rate_limited) — bukan di tiap percobaan gagal individual.
    status: resolved
  L-D3:
    question: "Field korelasi (session_id/request_id/correlation_id) dibuat baru di tiap task turunan, atau diwariskan?"
    chosen: "diwariskan_eksplisit"
    rationale: >
      Anti-pattern §12.9 melarang membuat correlation id baru di tengah alur
      yang sudah punya satu. Task async turunan (radio prefetch,
      download progress hook) WAJIB menerima id yang sudah ada sebagai
      parameter/context, bukan generate ulang — session_id dan request_id
      bertumpuk di contextvars (tidak saling menimpa), sesuai §5.2.
    status: resolved
  L-D4:
    question: "Kapan pemanggil boleh log ulang exception yang sudah dicatat resolver.py di boundary?"
    chosen: "hanya_jika_field_baru"
    rationale: >
      §12.5 melarang duplikasi log tanpa informasi baru. Pemanggil
      (download_manager.py, stream_prefetch.py, track_loader.py) berhenti
      logging exception yang sama dari resolver.py KECUALI pemanggil
      menambah field yang resolver.py sendiri tidak punya (mis. video_id
      mana yang sedang di-download saat resolve gagal di tengah unduhan).
    status: resolved
  L-D5:
    question: "CRITICAL dipakai untuk kegagalan operasional biasa atau hanya ancaman keberlangsungan proses?"
    chosen: "hanya_ancaman_keberlangsungan_proses"
    rationale: >
      §3 aturan pembeda ERROR vs CRITICAL: "apakah proses masih bisa
      melayani permintaan lain setelah ini?" MPV reconnect gagal total
      (observer.py:148), gagal bind port (app.py), dan gagal init DB saat
      boot adalah CRITICAL. Resolve satu video_id gagal (resolver.py:100)
      TETAP ERROR meski fallback juga gagal, karena proses lain tetap jalan.
    status: resolved

