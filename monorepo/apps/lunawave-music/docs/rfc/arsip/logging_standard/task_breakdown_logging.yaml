# PETA SESI
# ---------------------------------------------------------------------------
sessions:
  - session: 1
    label: "Fase 0 — Infrastruktur bersama (log_categories.py, log_context.py)"
    parallel_ok: true
    risk: low
    rationale: >
      File baru murni (belum dipakai modul manapun), tidak ada perubahan
      behavior. Prasyarat WAJIB untuk semua sesi lain (implementasi_plan §2,
      "infrastruktur dulu, isi kemudian") — tanpa ini, sesi 3-4 akan
      menghasilkan pola category/component yang tidak konsisten antar file.
    patchlog_group: "1 entry gabungan untuk L1.1..L1.2 (infra belum dipakai modul manapun)"
    tasks: [L0.1, L1.1, L1.2]

  - session: 2
    label: "Fase 1 — Logging keamanan (server/handlers/auth.py)"
    parallel_ok: false
    risk: medium
    rationale: >
      DEDICATED. G1 kritis (audit): nol logging di auth.py saat ini. Sesi
      keamanan disendirikan supaya tiap titik (login, rate-limit, sesi)
      diverifikasi satu per satu terhadap larangan §8/§12.1 (rahasia tidak
      boleh masuk log) sebelum lanjut ke migrasi massal sesi 3-4.
    tasks: [L2.1]

  - session: 3
    label: "Fase 2a — Rollout component/category ke file kecil (validasi pola)"
    parallel_ok: false
    risk: medium
    rationale: >
      DEDICATED, berurutan sesuai implementasi_plan §4.1 (call logger
      paling sedikit dulu). Tujuannya memvalidasi pola
      get_logger(component=...) + category=LC_* di file kecil sebelum
      diterapkan mekanis ke 37 file sisanya (sesi 4) — supaya kalau ada
      kesalahan pola, dampaknya masih kecil.
    patchlog_group: "1 entry gabungan untuk L3.1..L3.7 (rollout pola yang sama, urutan implementasi_plan §4.1 poin 1-7)"
    tasks: [L3.1, L3.2, L3.3, L3.4, L3.5, L3.6, L3.7]

  - session: 4
    label: "Fase 2b — Rollout ke 37 file sisa + severity CRITICAL (G2, G3, G7)"
    parallel_ok: true
    risk: medium
    rationale: >
      Pola sudah tervalidasi di sesi 3. 37 file sisa (per domain: playback →
      queue → cache → security → system, implementasi_plan §4.1 poin 8)
      relatif independen satu sama lain sehingga boleh dikerjakan tidak
      berurutan. Perbaikan severity (G7) dan penambahan CRITICAL (G2) di
      file yang sudah disentuh sesi 3 digabung ke sesi ini karena sama-sama
      "gerbang" sebelum sesi 5-9 (implementasi_plan: "Fase 2 adalah gerbang").
    tasks: [L4.1, L4.2, L4.3]

  - session: 5
    label: "Fase 3 — Korelasi async (session_id/request_id/correlation_id)"
    parallel_ok: true
    risk: medium
    rationale: >
      G4 tinggi. Empat titik pemasangan (WS session, command execute, radio
      cycle, download) independen satu sama lain — boleh paralel — tapi
      semua bergantung pada helper log_context.py dari sesi 1 (L1.2).
    tasks: [L5.1, L5.2, L5.3, L5.4]

  - session: 6
    label: "Fase 4 — Event key + structured field (71 call f-string)"
    parallel_ok: true
    risk: low
    rationale: >
      G5 tinggi. Penggantian f-string/kalimat naratif menjadi event key
      snake_case + field kwargs, per tabel implementasi_plan §6. Tiap file
      independen — boleh paralel — tapi harus menunggu sesi 3-4 selesai
      supaya event key baru sudah punya category/component yang benar.
    tasks: [L6.1, L6.2, L6.3, L6.4, L6.5]

  - session: 7
    label: "Fase 5 — Titik masuk/keluar alur utama (G6) + state change (§7.4)"
    parallel_ok: true
    risk: high
    rationale: >
      G6 tinggi. Sebagian besar task independen (command_bus, radio engine,
      download_manager, background loop) boleh paralel. L7.4 (perubahan
      state signifikan) menyentuh engine/playback/controller.py yang
      ditandai "risiko tinggi" di AI_CONTEXT.md — task itu WAJIB
      requires_human_confirmation dan idealnya dikerjakan terpisah dari
      task lain di sesi ini meski secara teknis sesi ini parallel_ok.
    tasks: [L7.1, L7.2, L7.3, L7.4, L7.5]

  - session: 8
    label: "Fase 6 — Bersihkan duplikasi log lintas lapisan (G8)"
    parallel_ok: false
    risk: medium
    rationale: >
      DEDICATED. Menyentuh 4 file terkait (resolver.py + 3 pemanggil)
      sekaligus dalam satu perubahan kebijakan logging yang konsisten —
      digabung supaya tidak ada file yang berhenti logging duluan sementara
      pemanggil lain belum, yang akan membuat kegagalan resolve jadi silent
      di sebagian jalur untuk sementara.
    tasks: [L8.1]

  - session: 9
    label: "Fase 7 — Housekeeping: ringkasan agregat + validasi noise (G10)"
    parallel_ok: true
    risk: low
    rationale: >
      Penutup migrasi: satu baris ringkasan agregat di track_filter.py
      (bukan pelanggaran §8.2, tapi gap terhadap §7.2/Best Practice #5) dan
      validasi akhir bahwa migrasi tidak menambah noise di hot path.
    patchlog_group: "PATCHLOG TERPISAH untuk sesi 9 (penutup, bukan bagian entry migrasi utama)"
    tasks: [L9.1, L9.2]

