tasks:

  # ---------- ORIENTASI ----------
  - id: L0.1
    title: "Baca standar + audit + rencana, cek owner file terkait"
    depends_on: []
    locked: false
    files: []
    steps:
      - "baca docs/rfc/logging_standard/LOGGING_STANDARD.md penuh (khususnya §3-§8, §11-§12)"
      - "baca docs/rfc/logging_standard/logging_audit.md penuh, khususnya tabel gap §4 (G1-G11)"
      - "baca docs/rfc/logging_standard/implementasi_plan_logging_advance.md penuh"
      - "baca AI_CONTEXT.md, konfirmasi status controller.py (risiko tinggi) dan websocket.py (jangan direfactor)"
      - "baca 2-3 entry terakhir docs/PATCHLOG.md untuk konteks sprint aktif"
    post_commands:
      - "python automation/find_owner.py core/log_config.py --json"
      - "python automation/find_owner.py server/middleware/traffic.py --json"
      - "python automation/find_owner.py server/handlers/auth.py --json"
      - "python automation/find_owner.py core/command_bus.py --json"
      - "python automation/find_owner.py server/connection_manager.py --json"
    dod: ["owner/dependency file infrastruktur logging existing dipahami sebelum implementasi"]
    patchlog: skip

  # ============================================================
  # SESI 1 — Fase 0: Infrastruktur bersama (parallel_ok: true)
  # ============================================================
