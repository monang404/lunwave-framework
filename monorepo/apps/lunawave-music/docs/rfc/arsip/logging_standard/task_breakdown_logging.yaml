    steps:
      - "get_logger(component=\"ws.auth\") menggantikan get_logger(__name__) di file ini"
      - "tambah log verifikasi token sukses (baris ~74-79): event auth_token_verified, level INFO, category=LC_AUTH, field client_ip"
      - "tambah log rate-limit terpicu >=5 percobaan (baris ~90-101): event auth_rate_limited, level WARNING, field client_ip + attempt_count"
      - "tambah log login sukses via password (baris ~120-130): event auth_login_succeeded, level INFO, field client_ip"
      - "tambah log login gagal (baris ~131-140): event auth_login_rejected, level INFO (L-D2 — bukan WARNING), field client_ip + reason=\"invalid_credentials\""
      - "tambah log sesi token dibuat (sessions.create_session): event auth_session_created, level INFO, field client_ip"
      - "WAJIB: JANGAN pernah tulis field password/token/stored_hash dalam bentuk apa pun (§8, §12.1) — hanya client_ip dan metadata non-rahasia"
    post_commands:
      - "grep -in 'password\\|stored_hash' server/handlers/auth.py"
