    dod:
      - "setiap percobaan login (sukses/gagal) dan setiap rate-limit menghasilkan tepat satu baris log"
      - "grep di atas untuk password/stored_hash sebagai VALUE field log menunjukkan nol kemunculan (bukan grep terhadap nama variabel kode, tapi terhadap kwargs logger)"
      - "core/security.py TIDAK disentuh (fungsi hash/verify murni, tidak butuh logging tambahan sesuai implementasi_plan §3)"
    bundle_cmd: 'zip -rq lunawave-L2.1.zip . -x ".git/*" -x "*__pycache__*" -x "*.pyc" -x ".pytest_cache/*" -x ".venv/*" -x "node_modules/*" -x "*.DS_Store" -x "lunawave-L-*.zip"'

