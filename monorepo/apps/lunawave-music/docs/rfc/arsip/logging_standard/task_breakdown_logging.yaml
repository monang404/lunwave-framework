    feature: logging_standard_migration
    session: 1
    parallel_ok: true
    title: "Buat core/log_categories.py — 14 konstanta kategori (§4)"
    depends_on: [L0.1]
    locked: false
    files: ["core/log_categories.py (baru)"]
    steps:
      - "definisikan 14 konstanta string sesuai §4: LC_LIFECYCLE, LC_SESSION, LC_AUTH, LC_COMMAND, LC_EVENT, LC_PLAYBACK, LC_QUEUE, LC_RADIO, LC_DOWNLOAD, LC_RESOLVE, LC_CACHE, LC_PERSISTENCE, LC_EXTERNAL, LC_SECURITY, LC_SYSTEM"
      - "daftar tertutup — TIDAK menambah kategori di luar 14 ini (§4 sengaja tidak berat/enterprise, prinsip desain #9)"
      - "tambah test unit sederhana: import semua konstanta, pastikan tidak ada duplikat nilai string"
    dod: ["14 konstanta terdefinisi persis sesuai nama di §4", "test import core/log_categories.py hijau"]

  - id: L1.2
    feature: logging_standard_migration
    session: 1
    parallel_ok: true
    title: "Buat core/log_context.py — helper korelasi (§5.2)"
    depends_on: [L1.1]
    locked: false
    files: ["core/log_context.py (baru)"]
    steps:
      - "tambah bind_session(session_id: str) — wrapper tipis atas structlog.contextvars.bind_contextvars, dipanggil sekali di ConnectionManager.connect()"
      - "tambah bind_request(request_id: str) — dipanggil di titik masuk CommandBus.execute() per eksekusi"
      - "tambah bind_correlation(correlation_id: str) — dipanggil di titik masuk alur yang menyeberang task terjadwal terpisah (radio cycle, download)"
      - "ikuti pola yang sudah terbukti benar di server/middleware/traffic.py (req_id) — TIDAK menulis ulang mekanisme baru"
      - "tambah unit test: bind/unbind simetris, dan test tidak bocor antar task asyncio (dua asyncio.create_task terpisah harus punya context masing-masing kecuali diwariskan eksplisit — anti-pattern §12.9)"
    post_commands: ["python automation/find_owner.py server/middleware/traffic.py --json"]
    dod:
      - "3 fungsi (bind_session, bind_request, bind_correlation) ada dan diekspor"
      - "test bind/unbind simetris PASS"
      - "test isolasi antar-task asyncio PASS (tidak ada context bocor tanpa pewarisan eksplisit)"
      - "tidak ada perubahan behavior di modul lain manapun — helper ini belum dipanggil dari mana pun"
    patchlog_group: session_1
    bundle_cmd: 'zip -rq lunawave-L1.2.zip . -x ".git/*" -x "*__pycache__*" -x "*.pyc" -x ".pytest_cache/*" -x ".venv/*" -x "node_modules/*" -x "*.DS_Store" -x "lunawave-L-*.zip"'

  # ============================================================
  # SESI 2 — Fase 1: Logging keamanan (DEDICATED, parallel_ok: false)
  # ============================================================
  - id: L2.1
    feature: logging_standard_migration
    session: 2
    parallel_ok: false
    risk: medium
    title: "Tambah logging auth.py — G1 (login, rate-limit, sesi)"
    depends_on: [L1.1, L1.2]
    locked: false
