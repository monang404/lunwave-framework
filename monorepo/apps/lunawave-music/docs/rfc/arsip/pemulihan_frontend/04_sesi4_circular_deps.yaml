# 04_sesi4_circular_deps.yaml
# Sesi 4 — Circular dependencies. WAJIB setelah sesi 2 selesai (lihat
# koreksi_terhadap_rencana_asli di 00_INDEX.yaml: 148 edge asli turun jadi
# 67 setelah fix eslint diterapkan). TIDAK BOLEH paralel dengan sesi lain.
#
# HASIL INVESTIGASI PENTING (dikerjakan penuh sebelum menulis file ini,
# bukan diserahkan mentah ke eksekutor): dari 67 edge yang tersisa, TIDAK
# ADA subset yang bisa diperbaiki mekanis-aman secara independen dari
# keputusan arsitektur di sesi 5. Detail di bawah. Karena itu sesi ini
# BUKAN "kerjakan 67 fix", tapi "1 keputusan konkret (visualizer) + laporan
# investigasi terstruktur untuk dibawa ke keputusan RFC sesi 5".

