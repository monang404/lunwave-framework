    hapus_import:
      - "baris 2: import { showActionModal } from \"../render/search.js\";"
      - "baris 4: import { showLogToast } from \"../render/toast.js\";"
    tambah_import:
      - 'import { emit } from "../bus.js";'
    penggantian_per_baris:
      - baris: 19
        lama: 'showLogToast("Hanya admin yang bisa memutar musik");'
        baru: 'emit("toast:log", { message: "Hanya admin yang bisa memutar musik" });'
        catatan: "reuse event toast:log, subscriber sudah ada di render/toast.js sejak Tahap 1."
      - baris: 43
        lama: "if (typeof showActionModal === \"function\") showActionModal(track);"
        baru: 'emit("search:action-modal-open", track);'
        catatan: "event BARU, subscriber ditambahkan di T5.9 (render/search.js)."
      - baris: 76
        lama: "if (track && typeof showActionModal === \"function\") showActionModal(track);"
        baru: 'if (track) emit("search:action-modal-open", track);'
    verifikasi:
