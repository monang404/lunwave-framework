# 11_tahap5_render_events_cross_import.yaml
# Tahap 5 (TERAKHIR) dari proposal_event_bus_frontend.md — render<->events
# cross-import murni: rule 'no-events-imports-render' (14 warning) + rule
# 'no-render-imports-events' (4 warning) di .dependency-cruiser.js, total
# 18, TERPISAH dari rule 'circular-dependencies' yang jadi target Tahap
# 1-4. Disusun dari pembacaan langsung SEMUA import lintas folder
# events/*.js <-> render/*.js per 2026-07-25 (`grep -rn 'from "\.\./render/'
# events/` dan `grep -rn 'from "\.\./events/' render/`) -- hasilnya PERSIS
# 14 + 4 = 18, cocok dengan angka di 05_sesi5_render_events.yaml
# (no_events_imports_render: 14, no_render_imports_events: 4). Tahap 1-4
# BELUM semua dieksekusi saat file ini ditulis -- task di sini SENGAJA
# reuse nama event dari Tahap 1/2/4, dan bergantung pada hasil Tahap 3
# (ekstraksi switchTab) untuk 2 dari 4 edge no-render-imports-events.

tahap: 5
proposal_acuan: "docs/rfc/pemulihan_frontend/proposal_event_bus_frontend.md"
depends_on:
  - "Tahap 1-4 selesai semua -- lihat catatan_dependensi_per_edge, beberapa edge di sini otomatis selesai sebagai efek samping Tahap 3/4, bukan dikerjakan ulang di sini"
parallel_ok: false
risk: sedang
butuh_konfirmasi_user_sebelum_mulai: true

catatan_dependensi_per_edge: >
  Dari 4 edge no-render-imports-events asli: 2 (render/discover-tab.js dan
  render/discover-personalize.js -> events/index.js, untuk switchTab)
  SUDAH SELESAI otomatis oleh Tahap 3 (09_tahap3_event_bus_events_index.yaml)
  begitu switchTab pindah ke render/navigation.js -- edge-nya jadi
  render->render, bukan render->events lagi, TIDAK dihitung ulang di sini.
  1 (render/full-state.js -> events/settings-events.js, untuk
  renderSettingsSheet) SUDAH SELESAI oleh Tahap 4 (import-nya dihapus
  total, diganti emit). SISA 1 edge nyata untuk tahap ini:
  render/discover-personalize.js -> events/settings-events.js
  (closeMainOverlay), ditangani T5.1 dengan REUSE event
  "overlay:main-close" yang sudah dibuat Tahap 4 -- BUKAN bikin event baru.
  Kalau saat eksekusi Tahap 3/4 ternyata belum selesai/di-skip, STOP dan
  laporkan -- jangan kerjakan T3/T4 punya tahap lain di sini secara diam-diam.

  Dari 14 edge no-events-imports-render: 13 murni tahap ini (T5.2-T5.8),
  1 (search-input-events.js -> render/search.js untuk playSearchTrack)
  DIPUTUSKAN TETAP direct import -- lihat keputusan_perlu_konfirmasi_user.

keputusan_perlu_konfirmasi_user:
  - item: "playSearchTrack (render/search.js) dipanggil dari events/search-input-events.js"
    temuan: >
      Audit isi playSearchTrack (render/search.js baris 93-96): cuma cek
      store.userRole lalu wsSend("play_track", track). TIDAK ADA manipulasi
      DOM sama sekali -- ini fungsi COMMAND (wrapper wsSend) yang kebetulan
      didefinisikan di file render/search.js, bukan fungsi render yang
      salah ditempatkan.
    keputusan_direkomendasikan: >
      JANGAN dipaksa lewat bus.emit (bus untuk notifikasi render, bukan
      dispatch command -- pakai bus di sini salah kaprah semantiknya).
      Terima sebagai exception terdokumentasi di .dependency-cruiser.js,
      pola sama seperti wsSend/getOrInitAudio yang sudah diterima legitimate
      sejak proposal §2. Edge ini akan TETAP muncul di 18 warning setelah
      Tahap 5 selesai -- itu wajar, bukan kegagalan tahap ini (lihat §3.5
      proposal soal target realistis, prinsipnya sama meski §3.5 aslinya
      bicara circular-dependencies, bukan rule render/events -- konsisten
      diterapkan di sini).
    opsi_alternatif: "Kalau user tetap mau 0 warning murni: pindahkan playSearchTrack ke ws.js (di sebelah wsSend lain) atau ke modul actions.js baru. Ini perubahan lokasi kode, bukan tambah bus -- efort kecil tapi di luar scope 'event bus' murni, perlu konfirmasi eksplisit terpisah kalau dipilih."

task:
  - id: T5.1
    title: "render/discover-personalize.js -- ganti closeMainOverlay() jadi emit('overlay:main-close') (reuse event dari Tahap 4)"
    action: edit
    file: "web/static/shared/js/render/discover-personalize.js"
    catatan_stop: "Baris hasil audit 2026-07-25, pastikan masih cocok saat eksekusi -- Tahap 3/4 tidak menyentuh file ini jadi nomor baris seharusnya stabil, tapi tetap cek."
    hapus_import:
      - "baris 3: import { closeMainOverlay } from \"../events/settings-events.js\";"
    tambah_import:
      - 'import { emit } from "../bus.js";'
    penggantian_per_baris:
      - baris: 184
        lama: "if (typeof closeMainOverlay === 'function') closeMainOverlay();"
        baru: 'emit("overlay:main-close");'
    verifikasi:
      - "node --input-type=module --check < web/static/shared/js/render/discover-personalize.js"

