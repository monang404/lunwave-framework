  - id: T5.9
    title: "Extend initSearchBusSubscriptions() (render/search.js) dan initLyricsBusSubscriptions() (render/lyrics.js) -- 3 event baru total"
    action: edit
    detail: "Kedua fungsi ini dibuat di Tahap 2 (T2.5) -- EXTEND, JANGAN buat fungsi init kedua, sama pola dengan semua extend sebelumnya."
    per_file:
      - file: "web/static/shared/js/render/search.js"
        target_fungsi: initSearchBusSubscriptions
        tambah_baris: |
          on("search:action-modal-open", (track) => showActionModal(track));
          on("search:action-modal-close", hideActionModal);
      - file: "web/static/shared/js/render/lyrics.js"
        target_fungsi: initLyricsBusSubscriptions
        tambah_baris: |
          on("lyrics:offset-display", updateOffsetDisplay);
      - file: "web/static/shared/js/render/discover-search.js"
        target_fungsi: initDiscoverSearchBusSubscriptions
        tambah_baris: |
          on("discover:search-loading-enter", (query) => enterDiscoverSearchLoading(query));
          on("discover:search-loading-exit", exitDiscoverSearchMode);
    verifikasi:
      - "node --input-type=module --check untuk ketiga file"
      - "npx eslint web/static/shared/js/render/search.js web/static/shared/js/render/lyrics.js web/static/shared/js/render/discover-search.js"

  - id: T5.10
    title: "Dokumentasikan exception playSearchTrack di .dependency-cruiser.js"
    action: edit
    file: ".dependency-cruiser.js"
    detail: >
      Tambah comment pada rule 'no-events-imports-render' yang menyebutkan
      events/search-input-events.js -> render/search.js (playSearchTrack)
      SENGAJA dibiarkan -- fungsi command (wsSend wrapper), bukan render,
      cuma kebetulan lokasinya di file render/search.js. Lihat
      keputusan_perlu_konfirmasi_user di file ini untuk detail investigasi.
    verifikasi:
      - "python automation/verify_docs.py --json -> tetap PASS"

  - id: T5.11
    title: "Regenerate depcruise final, laporan total 5 tahap"
    action: verify
    verifikasi:
      - "npx depcruise --config .dependency-cruiser.js web/static/shared/js -T json > /tmp/depcruise_final.txt"
      - "Bandingkan no-events-imports-render (harus 1, sisa playSearchTrack yang didokumentasikan exception) dan no-render-imports-events (harus 0, edge terakhir sudah dibereskan T5.1) terhadap baseline awal (14 dan 4)"
      - "Bandingkan circular-dependencies terhadap baseline Tahap 4"

  - id: T5.12
    title: "Manual test menyeluruh (WAJIB) -- semua jalur reaktif events->render yang baru dipindah ke bus"
    action: manual_test
    checklist:
      - "Klik 3-dots pada hasil search / discover / radio card -- action modal terbuka (search:action-modal-open)"
      - "Tutup action modal lewat tombol Cancel, Play Now, Enqueue, Delete, DAN lewat Escape -- semua jalur tertutup (search:action-modal-close)"
      - "Shortcut Escape, L (buka/tutup lyrics), '?' (help sheet) -- overlay & lyrics render benar"
      - "Play/Next/Prev/Repeat/Stop/Volume/Download/Radio toggle/Radio randomize/Output toggle via tombol player bar -- semua render lokal (optimistic UI) tetap muncul instan sebelum konfirmasi WS"
      - "Buka lyrics sheet, klik +/- sync offset berkali-kali -- angka offset di UI ter-update tiap klik (lyrics:offset-display)"
      - "Ketik di Quick Search Discover -- loading state muncul saat mengetik, hilang saat query dikosongkan (discover:search-loading-enter/exit)"
      - "Drag player bar progress -- posisi ter-update visual saat drag DAN setelah dilepas"
      - "Search lagu dari tab Search, klik salah satu hasil -- lagu diputar (playSearchTrack, jalur command tidak berubah)"
    laporan: "Laporkan hasil tiap item eksplisit ke user, jangan asumsikan lolos. Ini tahap TERAKHIR dari proyek arsitektur event bus -- pastikan regresi nihil sebelum ditutup."

  - id: T5.13
    title: "Patchlog + checkpoint (tahap terakhir)"
    action: patchlog_cmd
    detail: "Cek dulu `python automation/patchlog.py latest --n 1 --json` untuk nomor patch berikutnya sebelum menulis entry."
    checkpoint_cmd: "zip checkpoint ke checkpoints/lunawave-T5-eventbus.zip"

verifikasi_selesai:
  - "no-render-imports-events: 0 (dari baseline 4)"
  - "no-events-imports-render: 1 -- playSearchTrack, exception terdokumentasi, BUKAN kegagalan (lihat T5.10)"
  - "Semua render/*.js dan events/*.js yang diedit lulus node --check dan eslint"
  - "6 entry PATCHLOG baru (satu per T5.2-T5.8 kalau dipisah per file, atau digabung sesuai preferensi patchlog_group -- ikuti aturan_global di 00_INDEX.yaml: task dengan patchlog_group sama ditulis satu entry gabungan)"
  - "Proyek event bus (Tahap 1-5) SELESAI TOTAL -- laporkan ringkasan akhir ke user: baseline awal 65 circular-dependency + 18 render/events warning -> angka akhir aktual (BUKAN diasumsikan 0, laporkan angka nyata dari T5.11)"
