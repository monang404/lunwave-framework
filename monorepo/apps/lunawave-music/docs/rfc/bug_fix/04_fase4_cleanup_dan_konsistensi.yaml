  - task_id: P04-T6
    title: "Sapuan unused import / wildcard import (ruff F401/F403/F841)"
    proposal_ref: "§5.1"
    depends_on: ["P04-T1", "P04-T2"]
    touches_locked_files: false
    files:
      modify: []  # ditentukan dinamis oleh hasil linter, lihat langkah 1-2
    steps:
      - >
        Konfirmasi tooling linter yang sudah dipakai repo: `view`
        `pyproject.toml` untuk konfigurasi `ruff`/`flake8`/dll yang sudah
        ada. Kalau `ruff` sudah jadi dependency dev, jalankan
        `ruff check --select F401,F403,F841 .` dari root repo. Kalau
        belum ada ruff di environment, `pip install ruff
        --break-system-packages` HANYA untuk keperluan cek ini (tidak
        perlu ditambahkan ke requirements kecuali repo memang mau
        mengadopsinya permanen -- itu keputusan terpisah di luar scope
        task ini).
      - >
        Review OUTPUT linter SATU PER SATU secara manual -- JANGAN
        auto-fix massal (`ruff check --fix`) tanpa review, karena
        beberapa wildcard import di repo ini SENGAJA dipakai untuk
        re-export (lihat contoh `server/middleware/__init__.py:33-35`
        yang me-re-export `traffic_middleware` dari submodule -- ini pola
        SAH, bukan bug). Untuk tiap temuan F401 (unused import), F403
        (wildcard import), F841 (unused variable): klasifikasikan sebagai
        (a) benar-benar tidak terpakai -> hapus, atau (b) re-export/pola
        sengaja -> biarkan, tambahkan `# noqa: F401` dengan komentar
        alasan singkat kalau linter akan terus menandainya di CI masa
        depan.
      - >
        JANGAN masukkan file yang SUDAH ditangani task lain di fase ini
        (P04-T1 core/security.py, P04-T2 engine/radio/artist_selector.py)
        ke dalam sapuan ini lagi -- keduanya sudah dibereskan di task
        masing-masing dengan investigasi lebih dalam, bukan cuma
        auto-cleanup generik.
      - >
        Kelompokkan perubahan per area (mis. 1 commit/PATCHLOG entry
        untuk `engine/`, 1 untuk `server/`, 1 untuk `web/static/` kalau
        linter JS terpisah tersedia) SUPAYA diff tetap tertelusuri --
        JANGAN satu commit raksasa lintas seluruh repo tanpa pengelompokan,
        konsisten dengan governance "1 fase = 1 PATCHLOG entry, tidak
        digabung lintas file/fase" -- tapi karena ini SATU task_id,
        boleh 1 PATCHLOG entry untuk keseluruhan task ini asalkan
        deskripsi mencantumkan daftar file yang tersentuh.
      - >
        Setelah tiap kelompok perubahan: jalankan test suite penuh area
        terkait (`pytest tests/unit/<area> -q`) untuk memastikan
        penghapusan import tidak diam-diam menghapus sesuatu yang
        ternyata dipakai lewat efek samping import (mis. registrasi
        route/command via decorator saat modul di-import).
    acceptance_criteria:
      - "ruff check --select F401,F403,F841 (atau linter setara) bersih di seluruh file yang disentuh task ini, KECUALI baris yang eksplisit diberi noqa dengan alasan tercatat."
      - "Full test suite (pytest -q) tetap hijau setelah seluruh sapuan -- tidak ada import yang ternyata dibutuhkan untuk efek samping (registrasi decorator dll.) terhapus tanpa sadar."
    tests:
      run:
        - "ruff check --select F401,F403,F841 ."
        - "pytest -q"
    patchlog:
      type: cleanup
      area: "lintas repo (lihat files.modify di entry PATCHLOG aktual)"
      title: "Sapuan unused import & wildcard import"
      reason: >
        Banyak unused import, atribut mati, dan wildcard import yang
        menyulitkan maintenance tersebar di repo, di luar 2 kasus yang
        sudah ditangani lebih dalam di P04-T1 dan P04-T2.
      root_cause: >
        Tidak ada gate linter (F401/F403/F841) yang ditegakkan konsisten
        di CI/doctor.py selama ini.
      solution: >
        Review manual per temuan linter, hapus yang benar-benar tidak
        terpakai, tandai eksplisit (noqa + alasan) untuk wildcard
        import/re-export yang sengaja. Direkomendasikan menambahkan
        ruff check --select F401,F403,F841 ke automation/doctor.py
        sebagai gate permanen (keputusan terpisah, TIDAK dieksekusi
        otomatis di task ini kecuali pemilik project menyetujui).
      files: "TENTUKAN saat eksekusi berdasarkan hasil linter -- catat daftar lengkap di PATCHLOG entry aktual."
      notes: >
        Tidak menyentuh file locked. Task ini SENGAJA tidak
        mendaftar files.modify statis karena scope ditentukan hasil
        linter saat eksekusi, bukan direncanakan di muka.

post_phase_commands:
  - "python automation/doctor.py"
  - "python automation/generate_file_index.py"
  - "python automation/generate_report.py"
