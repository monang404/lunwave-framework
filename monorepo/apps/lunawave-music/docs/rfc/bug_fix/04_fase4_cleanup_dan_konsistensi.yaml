  - task_id: P04-T3
    title: "Satukan batas volume: MAX_VOLUME=100 sebagai satu sumber kebenaran"
    proposal_ref: "§4.4"
    depends_on: []
    touches_locked_files: false
    files:
      modify:
        - engine/volume_service.py
        - server/handlers/websocket.py
      create:
        - tests/unit/engine/test_volume_service_max.py
    steps:
      - >
        `view` engine/volume_service.py baris 42, 46, 51 (VERIFIKASI
        ULANG) -- konfirmasi 3 titik `min(150, ...)`/`max(0, min(150,
        int(vol)))` yang perlu diseragamkan.
      - >
        Tambah konstanta modul `MAX_VOLUME = 100` di
        engine/volume_service.py (dekat import/di atas class). Ganti
        SEMUA literal `150` di file itu (3 titik) jadi `MAX_VOLUME`.
      - >
        Cek apakah server perlu mengekspos `MAX_VOLUME` ini ke frontend
        supaya slider HTML `max="100"` di
        `web/static/pages/app/index.html:219` tidak lagi angka hardcode
        terpisah yang kebetulan sama. Kalau repo SUDAH punya mekanisme
        config-ke-frontend (cek apakah ada endpoint config/settings yang
        di-fetch frontend saat load, mis. `/api/config` atau sejenisnya
        -- grep `server/handlers` untuk pola ini), tambahkan MAX_VOLUME
        ke situ dan render slider `max` dari nilai itu di JS
        (BUKAN mengubah HTML statis -- set `volSlider.max` via JS saat
        render awal, cek pola render existing di
        `web/static/shared/js/render/player.js`). Kalau TIDAK ada
        mekanisme seperti itu, JANGAN membangun satu untuk task ini
        (di luar scope) -- cukup tinggalkan HTML `max="100"` apa adanya
        (sudah benar secara nilai, hanya bukan sumber kebenaran tunggal
        secara arsitektur) dan catat ini sebagai batasan di PATCHLOG
        notes.
      - >
        Test: volume_service dengan input 200 -> hasil ter-clamp ke 100
        (bukan 150 lagi). Test volume_up() berulang dari 95 -> tidak
        pernah melewati 100.
    acceptance_criteria:
      - "engine/volume_service.py tidak lagi punya literal 150 di jalur clamp volume -- satu konstanta MAX_VOLUME=100 dipakai konsisten."
      - "Tidak ada jalur (command WS apa pun) yang bisa membuat volume MPV aktual melebihi 100 setelah perubahan ini."
    tests:
      run:
        - "pytest tests/unit/engine/test_volume_service_max.py -q"
        - "pytest tests/unit/engine/test_volume_service.py -q"
    patchlog:
      type: bug_fix
      area: "engine"
      title: "Batas volume backend diselaraskan dengan UI (100, bukan 150)"
      reason: >
        UI membatasi slider volume ke 100%, tapi backend
        (volume_service.py) mengizinkan clamp hingga 150 -- inkonsistensi
        yang bisa dieksploitasi lewat command WS langsung (bypass UI)
        untuk memutar audio di volume yang tidak pernah dimaksudkan
        pengguna.
      root_cause: >
        Dua sumber kebenaran terpisah untuk batas volume yang sama:
        angka hardcode di HTML (100) dan literal terpisah di
        volume_service.py (150), tidak pernah disinkronkan.
      solution: >
        MAX_VOLUME=100 sebagai konstanta tunggal di volume_service.py.
        Sinkronisasi ke frontend dilakukan HANYA jika mekanisme
        config-ke-frontend sudah ada di repo (lihat notes untuk hasil
        investigasi ini).
      files: "engine/volume_service.py, tests/unit/engine/test_volume_service_max.py"
      notes: "Tidak menyentuh file locked. Catat di sini apakah sinkronisasi ke frontend dilakukan atau ditinggalkan sebagai batasan (lihat langkah 3)."

