  - task_id: P04-T4
    title: "Konfirmasi sebelum overwrite file download yang sudah ada"
    proposal_ref: "§4.5"
    depends_on: []
    touches_locked_files: false
    files:
      modify:
        - server/handlers/ws_download.py
      create:
        - tests/unit/server/handlers/test_ws_download_overwrite.py
    steps:
      - >
        `view` server/handlers/ws_download.py, fungsi
        `handle_download_command`, blok `if action == "download":`
        (baris ~38-42 saat audit -- VERIFIKASI ULANG). Saat ini langsung
        `await command_bus.execute(CMD_DOWNLOAD, track)` tanpa mengecek
        apakah file untuk track ini sudah pernah didownload.
      - >
        SEBELUM memanggil `command_bus.execute(CMD_DOWNLOAD, ...)`, cek
        `db_track = await tracks.get_track(track.video_id)` (pola sama
        seperti dipakai di blok `delete_download` beberapa baris di
        bawahnya) -- kalau `db_track` ada DAN `db_track.local_path` ada
        DAN file itu benar-benar masih ada di disk
        (`os.path.exists(db_track.local_path)`), JANGAN langsung
        eksekusi CMD_DOWNLOAD. Sebagai gantinya, kirim event baru ke
        client: `ws.send_str(json.dumps({"type": "download_conflict",
        "data": {"video_id": track.video_id, "local_path":
        db_track.local_path}}))` dan `return`.
      - >
        Tambah action WS baru `"download_confirm_overwrite"` di dispatch
        table `DOWNLOAD_CMDS` (cek definisi set/tuple `DOWNLOAD_CMDS` di
        `server/handlers/websocket.py`, tambahkan string baru ke situ)
        yang, ketika dipanggil, LANGSUNG mengeksekusi CMD_DOWNLOAD tanpa
        pengecekan konflik lagi (karena ini SUDAH konfirmasi eksplisit
        dari client/user).
      - >
        JANGAN implementasikan UI/frontend untuk dialog konfirmasi ini
        dalam task backend ini -- itu di luar scope task (kalau
        diperlukan, jadi task frontend terpisah; task ini hanya
        menyediakan kontrak event `download_conflict` yang bisa dipakai
        frontend nanti). Catat ini eksplisit di PATCHLOG notes sebagai
        "backend-only, frontend dialog belum diimplementasikan".
      - >
        Test: download track yang `local_path`-nya SUDAH ada di disk
        (mock `os.path.exists` True) -> assert event `download_conflict`
        terkirim, CMD_DOWNLOAD TIDAK terpanggil. Test kedua: track yang
        belum pernah didownload (get_track return None) -> CMD_DOWNLOAD
        terpanggil seperti biasa (regresi check, perilaku existing
        dipertahankan). Test ketiga: action
        `download_confirm_overwrite` -> CMD_DOWNLOAD terpanggil langsung
        tanpa cek konflik.
    acceptance_criteria:
      - "Download track yang file lokalnya sudah ada di disk TIDAK langsung menimpa -- mengirim event download_conflict dan menunggu konfirmasi eksplisit."
      - "Download track baru (belum pernah ada) tidak terpengaruh -- berjalan seperti sebelumnya tanpa langkah ekstra."
      - "Action download_confirm_overwrite tersedia sebagai jalur eksplisit untuk menimpa setelah user setuju."
    tests:
      run:
        - "pytest tests/unit/server/handlers/test_ws_download_overwrite.py -q"
        - "pytest tests/unit/server/handlers/test_ws_download.py -q"
        - "pytest tests/integration/test_download_flow.py -q"
    patchlog:
      type: bug_fix
      area: "server/handlers"
      title: "Konfirmasi sebelum overwrite file download yang sudah ada"
      reason: >
        Download otomatis menimpa file lama tanpa konfirmasi, berisiko
        kehilangan file yang sudah ada (mis. hasil edit manual pengguna
        pada file audio) tanpa peringatan.
      root_cause: >
        handle_download_command() langsung mengeksekusi CMD_DOWNLOAD
        begitu diminta, tanpa mengecek apakah local_path tujuan sudah
        terisi.
      solution: >
        Cek keberadaan file sebelum eksekusi; kalau konflik, kirim event
        download_conflict dan tunggu action eksplisit
        download_confirm_overwrite dari client. Backend-only dalam task
        ini -- dialog konfirmasi di frontend adalah pekerjaan terpisah.
      files: "server/handlers/ws_download.py, server/handlers/websocket.py, tests/unit/server/handlers/test_ws_download_overwrite.py"
      notes: "Tidak menyentuh file locked (websocket.py hanya tambah 1 string ke set DOWNLOAD_CMDS, bukan logika baru). Frontend dialog BELUM diimplementasikan -- backlog terpisah."

