  - task_id: P04-T5
    title: "Crossfade: restore volume eksplisit saat proses terputus"
    proposal_ref: "§4.8"
    depends_on: []
    touches_locked_files: false
    files:
      modify:
        - engine/playback/crossfade.py
      create:
        - tests/unit/engine/playback/test_crossfade_interrupted.py
    steps:
      - >
        `view` engine/playback/crossfade.py fungsi `apply_crossfade_in`
        dan `apply_crossfade_out` (baris 24-40 saat audit -- VERIFIKASI
        ULANG). Kedua fungsi punya loop yang `break` ketika
        `state.status not in (PLAYING, LOADING)`, tapi tidak
        mengembalikan volume MPV ke nilai target setelah break.
      - >
        Di `apply_crossfade_in`: setelah loop (baik selesai normal maupun
        `break` di tengah), tambah:
        `else:` TIDAK dipakai (Python for-else tidak cocok untuk kasus
        break eksplisit di sini) -- gunakan flag boolean
        `interrupted = False` di-set `True` sebelum `break`, lalu SETELAH
        loop: `if interrupted: await mpv.set_volume(state.volume)`
        (kembalikan ke volume target penuh, BUKAN 0, karena crossfade-in
        yang terinterupsi berarti track ini akan terus diputar/dijeda
        pada volume normal, bukan volume fade parsial).
      - >
        Di `apply_crossfade_out`: pola serupa dengan flag `interrupted`.
        Kalau terinterupsi (status bukan lagi PLAYING/LOADING di
        tengah fade-out), JANGAN paksa `set_volume(0)` di akhir (baris
        existing `if state.status in (PLAYING, LOADING): set_volume(0)`
        sudah benar untuk kasus TIDAK terinterupsi -- fade-out selesai
        natural). Untuk kasus terinterupsi, kembalikan ke
        `state.volume` (nilai target sebelum fade dimulai) SAMA seperti
        crossfade_in, dengan alasan yang sama: state pemutaran berikutnya
        harus mulai dari volume yang benar, bukan sisa fade parsial.
      - >
        Tambah docstring singkat di kedua fungsi menjelaskan kontrak
        baru: "Jika terinterupsi (status berubah di tengah proses),
        volume MPV dikembalikan ke state.volume secara eksplisit,
        supaya pemutaran berikutnya tidak mewarisi volume fade parsial
        yang salah."
      - >
        Test `apply_crossfade_in` diinterupsi di tengah (mock
        `state.status` berubah ke STOPPED setelah beberapa iterasi
        `asyncio.sleep` -- pakai teknik mocking yang sama dipakai
        `tests/unit/engine/playback/test_crossfade.py` existing kalau
        ada) -> assert `mpv.set_volume` dipanggil TERAKHIR KALI dengan
        `state.volume` (nilai penuh), bukan nilai parsial terakhir dari
        loop. Test yang sama untuk `apply_crossfade_out` diinterupsi.
        Test regresi: crossfade SELESAI NORMAL (tidak diinterupsi) --
        perilaku akhir (`mpv.set_volume` dipanggil dengan urutan nilai
        ramping penuh, diakhiri 0 untuk fade-out) TIDAK berubah dari
        sebelumnya.
    acceptance_criteria:
      - "Crossfade yang diinterupsi (status berubah di tengah proses) selalu diakhiri dengan mpv.set_volume(state.volume) sebagai panggilan terakhir, bukan volume parsial."
      - "Crossfade yang selesai normal (tidak diinterupsi) tidak berubah perilakunya sama sekali -- test existing test_crossfade.py tetap hijau tanpa modifikasi."
    tests:
      run:
        - "pytest tests/unit/engine/playback/test_crossfade_interrupted.py -q"
        - "pytest tests/unit/engine/playback/test_crossfade.py -q"
    patchlog:
      type: bug_fix
      area: "engine/playback"
      title: "Crossfade: volume dikembalikan eksplisit saat proses terputus"
      reason: >
        Crossfade yang terinterupsi (mis. user menekan stop/pause di
        tengah fade) meninggalkan volume MPV di nilai ramping parsial,
        bukan volume yang seharusnya -- pemutaran berikutnya mewarisi
        volume yang salah sampai ada perubahan volume eksplisit lain.
      root_cause: >
        Loop ramping volume di apply_crossfade_in/out hanya `break` saat
        terinterupsi tanpa langkah eksplisit mengembalikan volume ke
        nilai target/final yang benar.
      solution: >
        Flag `interrupted` dilacak di kedua fungsi; jika loop terputus,
        mpv.set_volume(state.volume) dipanggil eksplisit sebagai langkah
        korektif terakhir sebelum fungsi selesai.
      files: "engine/playback/crossfade.py, tests/unit/engine/playback/test_crossfade_interrupted.py"
      notes: "Tidak menyentuh file locked."

