[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lunawave"
version = "5.0.0"
description = "Personal music player berbasis yt-dlp, MPV, dan aiohttp"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402", "E722", "E712", "F811", "B018", "F403", "B007", "F841", "B028", "UP038", "B904", "F401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = ["^scratch/", "^tests/"]

[tool.bandit]
exclude_dirs = ["tests", "scratch", "scripts", ".venv", "venv"]
skips = ["B104", "B108", "B110", "B112", "B311", "B404", "B603", "B607", "B608"]

[tool.coverage.run]
source = ["core", "engine", "server", "persistence", "adapters", "services", "plugins"]
omit = [
    "launcher/gui/*",
    "start.py",
    "main.py",
    "automation/*",
    "*/scratch/*",
]

[tool.coverage.report]
show_missing = true

[tool.pyright]
extraPaths = ["scripts"]
